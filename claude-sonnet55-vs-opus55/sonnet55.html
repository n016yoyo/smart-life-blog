<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>벽돌깨기</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f1a; color: #fff; font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #12152a; border: 2px solid #2b3160; border-radius: 8px; max-width: 100vw; max-height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const ROWS = 6, COLS = 10, BW = 56, BH = 20, GAP = 4;
const OFFX = (W - (COLS * (BW + GAP) - GAP)) / 2, OFFY = 60;
const COLORS = ['#ff5470', '#ff9f43', '#feca57', '#1dd1a1', '#48dbfb', '#a29bfe'];

let paddle, ball, bricks, particles, score, lives, best, state, keys = {}, level;

best = +localStorage.getItem('brickBest') || 0;

function buildBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: OFFX + c * (BW + GAP), y: OFFY + r * (BH + GAP), color: COLORS[r], alive: true, pts: (ROWS - r) * 10 });
}

function resetBall() {
  const speed = 4 + (level - 1) * 0.5;
  const a = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
  ball = { x: paddle.x + paddle.w / 2, y: paddle.y - 8, r: 7, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, stuck: true, speed };
}

function newGame() {
  paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 30 };
  score = 0; lives = 3; level = 1; particles = [];
  buildBricks(); resetBall();
  state = 'ready';
}

function burst(x, y, color) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30 + Math.random() * 20, max: 50, color, size: 2 + Math.random() * 3 });
  }
}

function launch() {
  if (state === 'over') { newGame(); return; }
  if (state === 'ready') { state = 'play'; ball.stuck = false; }
}

function update() {
  if (state === 'over') { updateParticles(); return; }
  const sp = 7;
  if (keys.ArrowLeft || keys.a) paddle.x -= sp;
  if (keys.ArrowRight || keys.d) paddle.x += sp;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck) { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 1; }
  else {
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }

    // paddle
    if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 6 &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const a = -Math.PI / 2 + hit * (Math.PI / 3);
      ball.vx = Math.cos(a) * ball.speed; ball.vy = Math.sin(a) * ball.speed;
      ball.y = paddle.y - ball.r;
    }

    // bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BW && ball.y + ball.r > b.y && ball.y - ball.r < b.y + BH) {
        b.alive = false;
        score += b.pts;
        burst(b.x + BW / 2, b.y + BH / 2, b.color);
        const ox = Math.min(ball.x + ball.r - b.x, b.x + BW - (ball.x - ball.r));
        const oy = Math.min(ball.y + ball.r - b.y, b.y + BH - (ball.y - ball.r));
        if (ox < oy) ball.vx *= -1; else ball.vy *= -1;
        break;
      }
    }

    if (bricks.every(b => !b.alive)) {
      level++; buildBricks(); resetBall(); state = 'ready';
    }

    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        state = 'over';
        if (score > best) { best = score; localStorage.setItem('brickBest', best); }
      } else { resetBall(); state = 'ready'; }
    }
  }
  updateParticles();
}

function updateParticles() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, BW, BH, 4); ctx.fill();
  }

  ctx.fillStyle = '#e8ecff';
  ctx.beginPath(); ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6); ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#48dbfb'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#fff'; ctx.font = '16px system-ui';
  ctx.textAlign = 'left'; ctx.fillText('점수: ' + score, 16, 28);
  ctx.textAlign = 'center'; ctx.fillText('레벨 ' + level, W / 2, 28);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff5470'; ctx.fillText('♥'.repeat(Math.max(lives, 0)) || '', W - 16, 28);

  ctx.textAlign = 'center';
  if (state === 'ready') {
    ctx.fillStyle = '#fff'; ctx.font = '20px system-ui';
    ctx.fillText('스페이스 / 클릭으로 발사', W / 2, H / 2 + 60);
    ctx.font = '14px system-ui'; ctx.fillStyle = '#9aa3d6';
    ctx.fillText('← → 또는 마우스로 패들 이동', W / 2, H / 2 + 86);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(8,10,20,0.8)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff5470'; ctx.font = 'bold 48px system-ui';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
    ctx.fillStyle = '#fff'; ctx.font = '22px system-ui';
    ctx.fillText('점수: ' + score + '   최고 점수: ' + best, W / 2, H / 2 + 15);
    ctx.font = '16px system-ui'; ctx.fillStyle = '#9aa3d6';
    ctx.fillText('스페이스 / 클릭으로 다시 시작', W / 2, H / 2 + 55);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); launch(); }
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => keys[e.key] = false);

function moveTo(clientX) {
  if (state === 'over') return;
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
}
canvas.addEventListener('mousemove', e => moveTo(e.clientX));
canvas.addEventListener('touchmove', e => { moveTo(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
canvas.addEventListener('mousedown', launch);
canvas.addEventListener('touchstart', e => { moveTo(e.touches[0].clientX); launch(); e.preventDefault(); }, { passive: false });

newGame();
loop();
</script>
</body>
</html>
