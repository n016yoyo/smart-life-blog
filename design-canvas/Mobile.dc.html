<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
  <style>
    body{margin:0;font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f7f7f5;color:#0e0e0a;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    a:hover{color:#0e0e0a}
    button{font-family:inherit}
    .tab{border:1.5px solid rgba(0,0,0,0.1);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:#6f6e66;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:44px;box-sizing:border-box}
    .tab.on{background:#0e0e0a;color:#fff;border-color:#0e0e0a}
    .tab .n{font-size:11px;font-weight:800;opacity:.62;font-variant-numeric:tabular-nums}
    .row{display:flex;flex-direction:column;background:#fff;border:1px solid rgba(0,0,0,0.07);border-radius:16px;padding:15px 16px 14px;box-shadow:0 12px 28px -24px rgba(0,0,0,0.4);cursor:pointer}
    .row:active{transform:scale(.995)}
    .chip{font-size:11px;font-weight:800;letter-spacing:-0.01em;border-radius:999px;padding:3px 9px;border:1px solid transparent}
    .rt{font-weight:700;font-size:15.5px;line-height:1.36;letter-spacing:-0.022em;color:#0e0e0a;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
    .rs{font-size:12.5px;line-height:1.5;color:#6f6e66;margin-top:5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
    .chev{color:#cdccc4;flex:none}
    .more{width:100%;min-height:52px;border-radius:14px;border:1.5px solid rgba(0,0,0,0.12);background:#fff;font-size:14.5px;font-weight:700;color:#0e0e0a;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
  </style>
</helmet>

<div style="width:390px;background:#f7f7f5;min-height:2960px">

  <!-- 헤더 (현행 유지) -->
  <div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(247,247,245,0.86);border-bottom:1px solid rgba(0,0,0,0.05)">
    <div style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:0.04em;color:#3c3c34">
      <span style="width:12px;height:12px;border-radius:4px;background:linear-gradient(140deg,#34d399,#7c3aed)"></span>APPS
    </div>
    <div style="display:flex;gap:2px;padding:3px;background:#ececE8;border-radius:999px">
      <span style="border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;background:#0e0e0a;color:#fff">한국어</span>
      <span style="border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:#6f6e66">EN</span>
    </div>
  </div>

  <div style="padding:34px 20px 0">

    <div style="text-align:center;margin-bottom:22px">
      <div style="text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:0.22em;color:#6f6e66;margin-bottom:11px">GUIDES</div>
      <h2 style="font-weight:800;letter-spacing:-0.03em;font-size:25px;line-height:1.24;color:#0e0e0a;margin:0 0 9px;text-wrap:pretty">코딩 없이 AI로 만드는 법</h2>
      <p style="font-size:14px;line-height:1.55;color:#5a5a50;margin:0 0 10px;text-wrap:pretty">인스타에서 본 그것들, 만드는 법 전부 정리했어요</p>
      <p style="font-size:12px;font-weight:600;color:#75746b;margin:0;font-variant-numeric:tabular-nums">가이드 {{total}}편 · 마지막 업데이트 {{lastUpdate}}</p>
    </div>

    <!-- 최신 글 -->
    <a href="{{feat.url}}" target="_blank" rel="noopener" style="display:block;background:#fff;border:1px solid rgba(0,0,0,0.07);border-radius:20px;padding:19px 19px 17px;box-shadow:0 18px 40px -30px rgba(0,0,0,0.42);margin-bottom:22px">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:12px">
        <span style="font-size:10px;font-weight:800;letter-spacing:0.06em;color:#fff;background:#0e0e0a;border-radius:999px;padding:4px 8px">새 글</span>
        <span class="chip" style="color: {{feat.fg}}; background: {{feat.bg}}; border-color: {{feat.bd}}">{{feat.label}}</span>
      </div>
      <div style="font-weight:800;font-size:20px;line-height:1.32;letter-spacing:-0.032em;color:#0e0e0a;text-wrap:pretty">{{feat.t}}</div>
      <div style="font-size:13.5px;line-height:1.58;color:#5a5a50;margin-top:9px;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">{{feat.s}}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:14px">
        <span style="font-size:11.5px;font-weight:600;color:#75746b;font-variant-numeric:tabular-nums">{{feat.full}}</span>
        <span style="width:3px;height:3px;border-radius:50%;background:#d5d4cc"></span>
        <span style="font-size:11.5px;font-weight:600;color:#75746b">조회 [숫자]</span>
        <svg class="chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
      </div>
    </a>

    <!-- 카테고리 필터 -->
    <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px">
      <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="6">
        <button class="tab {{tab.cls}}" onClick="{{tab.pick}}">{{tab.name}}<span class="n">{{tab.count}}</span></button>
      </sc-for>
    </div>

    <!-- 목록 -->
    <div style="display:flex;flex-direction:column;gap:9px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="14">
        <a class="row" href="{{it.url}}" target="_blank" rel="noopener">
          <span style="display:flex;align-items:center;gap:8px">
            <span class="chip" style="color: {{it.fg}}; background: {{it.bg}}; border-color: {{it.bd}}">{{it.label}}</span>
            <span style="font-size:11px;font-weight:600;color:#75746b;margin-left:auto;font-variant-numeric:tabular-nums">{{it.d}}</span>
            <svg class="chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
          </span>
          <span class="rt">{{it.t}}</span>
          <span class="rs">{{it.s}}</span>
        </a>
      </sc-for>
    </div>

    <sc-if value="{{hasMore}}" hint-placeholder-val="{{true}}">
      <button class="more" onClick="{{showAll}}" style="margin-top:14px">가이드 {{total}}편 전체 보기<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
    </sc-if>

    <!-- 푸터 (현행 유지) -->
    <div style="border-top:1px solid rgba(0,0,0,0.07);padding:40px 0 48px;text-align:center;margin-top:40px">
      <p style="font-size:14px;color:#6f6e66;margin:0 0 22px">매일의 번거로움을 대신 해결합니다.</p>
      <div style="display:flex;justify-content:center;gap:10px">
        <a href="mailto:n016yoyo@gmail.com" style="font-size:14px;font-weight:600;padding:0 20px;min-height:44px;display:inline-flex;align-items:center;border-radius:11px;border:1px solid rgba(0,0,0,0.12)">Email</a>
        <a href="https://n016yoyo.blogspot.com" target="_blank" rel="noopener" style="font-size:14px;font-weight:600;padding:0 20px;min-height:44px;display:inline-flex;align-items:center;border-radius:11px;border:1px solid rgba(0,0,0,0.12)">Blog</a>
      </div>
      <p style="font-size:12.5px;color:#6f6e66;margin:26px 0 0">© 2026 · DONGHYUCK YANG</p>
    </div>

  </div>
</div>
