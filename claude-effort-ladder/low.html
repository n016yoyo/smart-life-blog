<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Low-poly Running Tiger</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f3e3c3}</style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3e3c3);
scene.fog = new THREE.Fog(0xf3e3c3, 12, 30);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6, 3, 7);
camera.lookAt(0, 1.2, 0);

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x806040, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(5, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// 바닥
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 8),
  new THREE.MeshStandardMaterial({ color: 0xc9a86a, flatShading: true })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 재질
const mat = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true });
const ORANGE = mat(0xe8761e), BLACK = mat(0x1a1a1a), WHITE = mat(0xf5efe0), PINK = mat(0xd46a6a);

function mesh(geo, m, parent, x = 0, y = 0, z = 0) {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z);
  o.castShadow = true;
  parent.add(o);
  return o;
}
function pivot(parent, x = 0, y = 0, z = 0) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  parent.add(g);
  return g;
}

// 호랑이 (x축이 앞쪽)
const tiger = pivot(scene);
const body = pivot(tiger, 0, 1.5, 0);

// 몸통
mesh(new THREE.BoxGeometry(2.4, 0.9, 0.95), ORANGE, body);
mesh(new THREE.BoxGeometry(2.0, 0.25, 0.8), WHITE, body, 0, -0.42, 0);
for (let i = 0; i < 5; i++) {
  const s = mesh(new THREE.BoxGeometry(0.14, 0.92, 0.98), BLACK, body, -0.9 + i * 0.42, 0.02, 0);
  s.rotation.z = 0.25;
}

// 머리
const neck = pivot(body, 1.2, 0.3, 0);
const head = pivot(neck, 0.35, 0.1, 0);
mesh(new THREE.BoxGeometry(0.8, 0.75, 0.85), ORANGE, head);
mesh(new THREE.BoxGeometry(0.4, 0.35, 0.55), WHITE, head, 0.5, -0.15, 0);
mesh(new THREE.BoxGeometry(0.12, 0.12, 0.2), PINK, head, 0.72, -0.02, 0);
mesh(new THREE.BoxGeometry(0.06, 0.1, 0.1), BLACK, head, 0.41, 0.12, 0.22);
mesh(new THREE.BoxGeometry(0.06, 0.1, 0.1), BLACK, head, 0.41, 0.12, -0.22);
for (const z of [0.28, -0.28]) {
  const ear = mesh(new THREE.ConeGeometry(0.15, 0.3, 4), ORANGE, head, -0.15, 0.5, z);
  ear.rotation.y = Math.PI / 4;
}
mesh(new THREE.BoxGeometry(0.08, 0.1, 0.87), BLACK, head, 0.1, 0.3, 0);
mesh(new THREE.BoxGeometry(0.08, 0.1, 0.87), BLACK, head, -0.15, 0.3, 0);
const jaw = pivot(head, 0.2, -0.3, 0);
mesh(new THREE.BoxGeometry(0.5, 0.15, 0.5), WHITE, jaw, 0.2, -0.05, 0);

// 다리 (허벅지 + 정강이 2관절)
function makeLeg(x, z) {
  const hip = pivot(body, x, -0.35, z);
  mesh(new THREE.BoxGeometry(0.34, 0.75, 0.3), ORANGE, hip, 0, -0.35, 0);
  mesh(new THREE.BoxGeometry(0.36, 0.1, 0.32), BLACK, hip, 0, -0.3, 0);
  const knee = pivot(hip, 0, -0.7, 0);
  mesh(new THREE.BoxGeometry(0.26, 0.55, 0.24), ORANGE, knee, 0, -0.25, 0);
  mesh(new THREE.BoxGeometry(0.38, 0.14, 0.3), WHITE, knee, 0.05, -0.55, 0);
  return { hip, knee };
}
// 갤럽 위상 (0~1)
const legs = [
  { ...makeLeg(0.85, 0.3), phase: 0.0 },   // 앞 왼
  { ...makeLeg(0.85, -0.3), phase: 0.1 },  // 앞 오
  { ...makeLeg(-0.85, 0.3), phase: 0.5 },  // 뒤 왼
  { ...makeLeg(-0.85, -0.3), phase: 0.6 }, // 뒤 오
];

// 꼬리 (체인)
const tail = [];
let parent = pivot(body, -1.2, 0.3, 0);
for (let i = 0; i < 6; i++) {
  const seg = pivot(parent, i === 0 ? 0 : -0.28, 0, 0);
  mesh(new THREE.BoxGeometry(0.3, 0.13 - i * 0.008, 0.13 - i * 0.008),
       i % 2 ? BLACK : ORANGE, seg, -0.14, 0, 0);
  tail.push(seg);
  parent = seg;
}

// 스크롤되는 풀/돌 (달리는 느낌)
const props = [];
for (let i = 0; i < 24; i++) {
  const p = mesh(new THREE.ConeGeometry(0.08 + Math.random() * 0.1, 0.3 + Math.random() * 0.4, 4),
    mat(Math.random() < 0.5 ? 0x7a8b3a : 0x9aa04a), scene,
    Math.random() * 24 - 12, 0.2, (Math.random() < 0.5 ? 1 : -1) * (1.5 + Math.random() * 5));
  props.push(p);
}

// 애니메이션
const clock = new THREE.Clock();
const SPEED = 1.6; // 초당 사이클
const TAU = Math.PI * 2;

function animate() {
  const t = clock.getElapsedTime();
  const c = t * SPEED * TAU; // 사이클 각도 — 모든 움직임이 이 주기의 배수라 끊김 없이 반복

  // 몸통: 두 번 튀는 갤럽 바운스 + 앞뒤 흔들림
  body.position.y = 1.5 + Math.abs(Math.sin(c)) * 0.18;
  body.rotation.z = Math.sin(c + 0.8) * 0.12;

  // 다리
  for (const L of legs) {
    const a = c - L.phase * TAU;
    L.hip.rotation.z = Math.sin(a) * 0.75;
    // 다리가 앞으로 나갈 때 무릎 굽힘
    L.knee.rotation.z = -Math.max(0, Math.cos(a)) * 1.1 + 0.1;
  }

  // 머리: 몸통 흔들림 상쇄 + 끄덕임, 입 벌림
  neck.rotation.z = -body.rotation.z * 0.8 + Math.sin(c + 2) * 0.08;
  jaw.rotation.z = -0.15 - Math.max(0, Math.sin(c)) * 0.25;

  // 꼬리: 지연 전파 파동
  tail.forEach((s, i) => {
    s.rotation.z = (i === 0 ? 0.5 : 0) + Math.sin(c - i * 0.6) * 0.18;
    s.rotation.y = Math.sin(c * 0.5 - i * 0.5) * 0.15;
  });

  // 배경 스크롤
  for (const p of props) {
    p.userData.x0 ??= p.position.x;
    p.position.x = ((p.userData.x0 + 12 - t * 7) % 24 + 24) % 24 - 12;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
