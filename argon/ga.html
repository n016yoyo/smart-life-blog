<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>해 질 녘 바닷가 등대</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #120c24;
  }
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }
  svg {
    display: block;
    width: 1080px;
    height: 1080px;
  }

  .beam {
    transform-box: view-box;
    transform-origin: 280px 345px;
    animation: sweep 7s ease-in-out infinite alternate;
  }
  @keyframes sweep {
    0%   { transform: rotate(-14deg); opacity: 0.55; }
    50%  { opacity: 0.9; }
    100% { transform: rotate(18deg); opacity: 0.6; }
  }

  .lamp-glow {
    transform-box: fill-box;
    transform-origin: center;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.15); }
  }

  .star { animation: twinkle 3s ease-in-out infinite; }
  .star:nth-child(2n) { animation-delay: 1.1s; }
  .star:nth-child(3n) { animation-delay: 2.2s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.9; }
  }

  .shimmer { animation: shimmer 2.8s ease-in-out infinite; }
  .shimmer:nth-child(2n) { animation-delay: 0.7s; }
  .shimmer:nth-child(3n) { animation-delay: 1.4s; }
  @keyframes shimmer {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.85; }
  }

  .wave-a { animation: drift 9s linear infinite; }
  .wave-b { animation: drift 13s linear infinite reverse; }
  .wave-c { animation: drift 17s linear infinite; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-120px); }
  }

  .foam { animation: foam 3.2s ease-in-out infinite; }
  .foam:nth-child(2) { animation-delay: 1.1s; }
  .foam:nth-child(3) { animation-delay: 2.1s; }
  @keyframes foam {
    0%, 100% { opacity: 0.25; transform: translateX(0); }
    50%      { opacity: 0.9;  transform: translateX(-8px); }
  }

  .birds { animation: fly 26s linear infinite; }
  @keyframes fly {
    from { transform: translate(-120px, 0); }
    to   { transform: translate(1200px, -60px); }
  }
  .wing { animation: flap 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes flap {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(0.45); }
  }

  .cloud { animation: cloud 60s linear infinite alternate; }
  @keyframes cloud {
    from { transform: translateX(-30px); }
    to   { transform: translateX(40px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="해 질 녘 바닷가 절벽 위 등대">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1f1440"/>
      <stop offset="0.28" stop-color="#4a2462"/>
      <stop offset="0.5"  stop-color="#9a3d6c"/>
      <stop offset="0.68" stop-color="#e2664e"/>
      <stop offset="0.82" stop-color="#f7a35a"/>
      <stop offset="1"    stop-color="#ffd58e"/>
    </linearGradient>

    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#f0a463"/>
      <stop offset="0.12" stop-color="#c46a62"/>
      <stop offset="0.4"  stop-color="#5e3463"/>
      <stop offset="1"    stop-color="#160f30"/>
    </linearGradient>

    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0"   stop-color="#fff6d6"/>
      <stop offset="0.5" stop-color="#ffd27a"/>
      <stop offset="1"   stop-color="#ff8a4a"/>
    </radialGradient>

    <radialGradient id="sunHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffe2a0" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#ffb070" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#ff8a5a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fffbe0" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#ffe08a" stop-opacity="0.7"/>
      <stop offset="1"   stop-color="#ffb84a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#fff4c4" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#ffe7a0" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#ffe7a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0"   stop-color="#fff4c4" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffe7a0" stop-opacity="0.1"/>
      <stop offset="1"   stop-color="#ffe7a0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cloudG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb08a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b34d6e" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="towerShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#000" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.7"  stop-color="#ffb070" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#000" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="cliffG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1d3e"/>
      <stop offset="1" stop-color="#120b22"/>
    </linearGradient>

    <clipPath id="aboveHorizon">
      <rect x="0" y="0" width="1080" height="700"/>
    </clipPath>
    <clipPath id="towerClip">
      <polygon points="235,590 325,590 310,380 250,380"/>
    </clipPath>
  </defs>

  <!-- 하늘 -->
  <rect width="1080" height="700" fill="url(#sky)"/>

  <!-- 별 -->
  <g fill="#fff">
    <circle class="star" cx="90"  cy="70"  r="1.6"/>
    <circle class="star" cx="210" cy="140" r="1.2"/>
    <circle class="star" cx="380" cy="60"  r="1.8"/>
    <circle class="star" cx="520" cy="120" r="1.1"/>
    <circle class="star" cx="640" cy="45"  r="1.5"/>
    <circle class="star" cx="760" cy="150" r="1.2"/>
    <circle class="star" cx="880" cy="80"  r="1.7"/>
    <circle class="star" cx="1000" cy="130" r="1.3"/>
    <circle class="star" cx="960" cy="40"  r="1.1"/>
    <circle class="star" cx="300" cy="210" r="1"/>
    <circle class="star" cx="700" cy="230" r="1"/>
  </g>

  <!-- 구름 -->
  <g class="cloud" fill="url(#cloudG)">
    <ellipse cx="200" cy="300" rx="170" ry="16" opacity="0.55"/>
    <ellipse cx="260" cy="286" rx="90"  ry="12" opacity="0.5"/>
    <ellipse cx="860" cy="360" rx="210" ry="18" opacity="0.6"/>
    <ellipse cx="930" cy="344" rx="110" ry="12" opacity="0.5"/>
    <ellipse cx="620" cy="470" rx="240" ry="10" opacity="0.45"/>
    <ellipse cx="980" cy="520" rx="160" ry="8"  opacity="0.4"/>
  </g>

  <!-- 해 -->
  <circle cx="760" cy="690" r="320" fill="url(#sunHalo)"/>
  <g clip-path="url(#aboveHorizon)">
    <circle cx="760" cy="700" r="105" fill="url(#sun)"/>
  </g>

  <!-- 먼 섬 실루엣 -->
  <path d="M960 700 Q1000 672 1040 680 Q1065 684 1080 676 L1080 700 Z" fill="#7a3a5e" opacity="0.8"/>
  <path d="M480 700 Q520 688 560 692 Q590 695 610 700 Z" fill="#8c4262" opacity="0.6"/>

  <!-- 바다 -->
  <rect x="0" y="700" width="1080" height="380" fill="url(#sea)"/>
  <rect x="0" y="699" width="1080" height="3" fill="#ffd9a0" opacity="0.7"/>

  <!-- 해 반사 -->
  <g fill="#ffe0a0">
    <rect class="shimmer" x="670" y="712" width="180" height="5" rx="2.5"/>
    <rect class="shimmer" x="690" y="728" width="140" height="4" rx="2"/>
    <rect class="shimmer" x="650" y="744" width="200" height="4" rx="2"/>
    <rect class="shimmer" x="705" y="762" width="110" height="4" rx="2"/>
    <rect class="shimmer" x="680" y="782" width="150" height="3" rx="1.5"/>
    <rect class="shimmer" x="720" y="804" width="80"  height="3" rx="1.5"/>
    <rect class="shimmer" x="695" y="828" width="120" height="3" rx="1.5"/>
    <rect class="shimmer" x="735" y="856" width="55"  height="3" rx="1.5"/>
    <rect class="shimmer" x="710" y="888" width="90"  height="2.5" rx="1.25"/>
    <rect class="shimmer" x="745" y="922" width="40"  height="2.5" rx="1.25"/>
  </g>

  <!-- 물결 -->
  <g fill="none" stroke-linecap="round">
    <path class="wave-a" stroke="#ffc58a" stroke-opacity="0.35" stroke-width="2"
          d="M0 760 q30 -6 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
    <path class="wave-b" stroke="#e98a78" stroke-opacity="0.3" stroke-width="2.5"
          d="M0 840 q40 -8 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
    <path class="wave-c" stroke="#a85f88" stroke-opacity="0.35" stroke-width="3"
          d="M0 940 q60 -10 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0"/>
    <path class="wave-a" stroke="#7a4a86" stroke-opacity="0.35" stroke-width="3"
          d="M0 1030 q60 -12 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0"/>
  </g>

  <!-- 등대 불빛 줄기 -->
  <g class="beam">
    <polygon points="280,345 1200,230 1200,470" fill="url(#beamR)"/>
    <polygon points="280,345 -620,250 -620,450" fill="url(#beamL)"/>
  </g>

  <!-- 절벽 -->
  <path d="M0 610 L90 596 L170 588 L240 584 L330 588 L390 612 L425 650 L452 700 L480 760 L520 820 L556 890 L590 980 L610 1080 L0 1080 Z"
        fill="url(#cliffG)"/>
  <path d="M330 588 L390 612 L425 650 L452 700 L480 760 L520 820 L556 890 L590 980 L610 1080 L570 1080 L548 980 L512 890 L470 820 L432 760 L404 700 L376 650 L346 612 Z"
        fill="#3b2650" opacity="0.6"/>
  <path d="M0 610 L90 596 L170 588 L240 584 L330 588 L390 612" fill="none" stroke="#e98a6a" stroke-opacity="0.45" stroke-width="3"/>

  <!-- 파도 거품 -->
  <g fill="none" stroke="#ffe6cc" stroke-width="3" stroke-linecap="round">
    <path class="foam" d="M600 1000 q20 -10 40 0 q16 8 34 0"/>
    <path class="foam" d="M566 920 q18 -8 36 0 q14 6 28 0"/>
    <path class="foam" d="M530 850 q16 -8 30 0 q12 6 24 0"/>
  </g>

  <!-- 등대 -->
  <g>
    <!-- 받침 -->
    <rect x="220" y="584" width="120" height="12" rx="3" fill="#2b1f3a"/>

    <!-- 몸통 -->
    <polygon points="235,590 325,590 310,380 250,380" fill="#f4ece4"/>
    <g clip-path="url(#towerClip)" fill="#c8323c">
      <rect x="200" y="410" width="160" height="34"/>
      <rect x="200" y="478" width="160" height="34"/>
      <rect x="200" y="546" width="160" height="34"/>
    </g>
    <polygon points="235,590 325,590 310,380 250,380" fill="url(#towerShade)"/>

    <!-- 창문 -->
    <rect x="273" y="450" width="14" height="22" rx="7" fill="#ffcf7a"/>
    <rect x="271" y="520" width="18" height="26" rx="9" fill="#2a1a33"/>

    <!-- 난간 -->
    <rect x="238" y="370" width="84" height="12" rx="2" fill="#2b1f3a"/>
    <g stroke="#2b1f3a" stroke-width="2">
      <line x1="246" y1="356" x2="246" y2="370"/>
      <line x1="262" y1="356" x2="262" y2="370"/>
      <line x1="298" y1="356" x2="298" y2="370"/>
      <line x1="314" y1="356" x2="314" y2="370"/>
      <line x1="242" y1="356" x2="318" y2="356"/>
    </g>

    <!-- 등실 -->
    <circle class="lamp-glow" cx="280" cy="345" r="70" fill="url(#lampGlow)"/>
    <rect x="258" y="322" width="44" height="48" fill="#ffe9a6"/>
    <g stroke="#2b1f3a" stroke-width="2.5">
      <line x1="272" y1="322" x2="272" y2="370"/>
      <line x1="288" y1="322" x2="288" y2="370"/>
    </g>
    <rect x="258" y="322" width="44" height="48" fill="none" stroke="#2b1f3a" stroke-width="3"/>
    <circle cx="280" cy="346" r="9" fill="#fffbe8"/>

    <!-- 지붕 -->
    <polygon points="250,323 310,323 280,288" fill="#a8262f"/>
    <polygon points="280,288 310,323 290,323" fill="#000" opacity="0.2"/>
    <rect x="277" y="276" width="6" height="14" rx="2" fill="#2b1f3a"/>
    <circle cx="280" cy="274" r="5" fill="#2b1f3a"/>
  </g>

  <!-- 절벽 위 풀 -->
  <g stroke="#1a1029" stroke-width="2.5" stroke-linecap="round">
    <line x1="60"  y1="602" x2="56"  y2="588"/>
    <line x1="66"  y1="601" x2="70"  y2="586"/>
    <line x1="150" y1="592" x2="146" y2="578"/>
    <line x1="156" y1="591" x2="161" y2="577"/>
    <line x1="360" y1="598" x2="356" y2="585"/>
    <line x1="366" y1="600" x2="371" y2="587"/>
  </g>

  <!-- 새 -->
  <g class="birds" fill="none" stroke="#2a1838" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path class="wing" d="M120 260 q9 -9 18 0 q9 -9 18 0"/>
    <path class="wing" d="M165 240 q7 -7 14 0 q7 -7 14 0" style="animation-delay:.3s"/>
    <path class="wing" d="M90 232 q6 -6 12 0 q6 -6 12 0" style="animation-delay:.55s"/>
  </g>
</svg>
</body>
</html>
