<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<title>SHOWREEL 2026 — Motion Design</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;inset:0;margin:auto;display:block;cursor:pointer}
  #ui{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em;transition:opacity .5s}
  #ui.hide{opacity:0;pointer-events:none}
  #ui button{font:inherit;letter-spacing:inherit;background:rgba(10,10,15,.55);color:#f2efe9;border:1px solid rgba(242,239,233,.28);padding:10px 14px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #ui button:hover{background:#ff3d2e;border-color:#ff3d2e}
  #snd.hint{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{border-color:#ff3d2e;box-shadow:0 0 0 4px rgba(255,61,46,.25)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="snd" class="hint" title="M">▶ SOUND ON</button>
  <button id="rst" title="R">↺ RESTART</button>
  <button id="fs" title="F">⤢ FULL</button>
</div>
<script>
'use strict';
/* =========================================================
   SHOWREEL 2026 — 15s, 1920×1080 virtual stage, 120 BPM
   Canvas2D + WebAudio, single file, deterministic timeline
   ========================================================= */
const W = 1920, H = 1080, DUR = 15, BEAT = .5, TAU = Math.PI * 2;
const C = { bg:'#0a0a0f', ink:'#f2efe9', red:'#ff3d2e', blue:'#2f4bff', yel:'#ffd23f', org:'#ff7a2e' };
const NAMES = ['INTRO', 'FORM', 'PARTICLES', 'DIMENSION', 'KINETIC TYPE', 'SIGNATURE'];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let w = innerWidth, h = w * 9 / 16;
  if (h > innerHeight) { h = innerHeight; w = h * 16 / 9; }
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = cv.width / W;
}
addEventListener('resize', resize); resize();

/* ---------- math / easing ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------- drawing helpers ---------- */
const F = (w, s) => `${w} ${s}px "Helvetica Neue",Helvetica,Arial,sans-serif`;
const MONO = s => `500 ${s}px ui-monospace,"SF Mono",Menlo,Consolas,monospace`;
function bgFill(c) { ctx.fillStyle = c; ctx.fillRect(-80, -80, W + 160, H + 160); }
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const wcache = {};
function charWidths(str, font) {
  const k = font + '|' + str;
  if (!wcache[k]) { ctx.save(); ctx.font = font; wcache[k] = [...str].map(c => ctx.measureText(c).width); ctx.restore(); }
  return wcache[k];
}
function textWidth(str, font, track) { return charWidths(str, font).reduce((a, b) => a + b, 0) + track * (str.length - 1); }
// per-letter animated text, centered on x
function letters(str, x, y, font, track, fn) {
  const ws = charWidths(str, font);
  let cx = x - textWidth(str, font, track) / 2;
  ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < str.length; i++) {
    const w = ws[i], s = (fn && fn(i, str.length)) || {};
    if (s.a !== 0) {
      ctx.save();
      ctx.translate(cx + w / 2 + (s.x || 0), y + (s.y || 0));
      if (s.r) ctx.rotate(s.r);
      if (s.s != null) ctx.scale(s.s, s.s);
      if (s.a != null) ctx.globalAlpha *= s.a;
      ctx.fillText(str[i], 0, 0);
      ctx.restore();
    }
    cx += w + track;
  }
}
function typeText(str, x, y, p, cursor = true) {
  const n = Math.floor(str.length * p);
  if (n <= 0) return;
  ctx.fillText(str.slice(0, n) + (cursor && n < str.length ? '█' : ''), x, y);
}

/* =========================================================
   SCENE 1 — INTRO  (0 – 2.5s)
   ========================================================= */
function s1(t) {
  bgFill(C.bg);
  const cx = W / 2, cy = H / 2;

  // construction guides
  const gIn = E.outExpo(P(t, 0, .7)), gOut = P(t, .9, 1.5);
  if (gIn > 0 && gOut < 1) {
    ctx.globalAlpha = .16 * (1 - gOut); ctx.fillStyle = C.ink;
    ctx.fillRect(cx - W * gIn / 2, cy - .5, W * gIn, 1);
    ctx.fillRect(cx - .5, cy - H * gIn / 2, 1, H * gIn);
    ctx.font = MONO(14); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('x 960  y 540', cx + 14, cy - 14);
    ctx.globalAlpha = 1;
  }

  const pop = E.outBack(P(t, 0, .32));
  const st = E.outExpo(P(t, .32, .8));
  const sp = E.inOutExpo(P(t, .8, 1.15));
  const w0 = lerp(26, 1320, st) * pop, h0 = lerp(26, 4, st) * pop;
  const gap = sp * 200;
  const ex1 = E.inOutExpo(P(t, 1.88, 2.18)), ex2 = E.inOutExpo(P(t, 1.94, 2.24));

  if (pop > 0) {
    ctx.fillStyle = C.ink;
    if (sp <= 0) { rrect(cx - w0 / 2, cy - h0 / 2, w0, h0, h0 / 2); ctx.fill(); }
    else {
      let x0 = cx - w0 / 2 + w0 * ex1, x1 = cx + w0 / 2;
      if (x1 - x0 > .5) ctx.fillRect(x0, cy - gap - 2, x1 - x0, 4);
      const bx0 = cx - w0 / 2, bx1 = cx + w0 / 2 - w0 * ex2;
      if (bx1 - bx0 > .5) ctx.fillRect(bx0, cy + gap - 2, bx1 - bx0, 4);
      // accent caps
      ctx.fillStyle = C.red;
      const q1 = 16 * sp * (1 - ex1), q2 = 16 * sp * (1 - ex2);
      if (q1 > 0) ctx.fillRect(x1 - q1 / 2, cy - gap - q1 / 2, q1, q1);
      if (q2 > 0) ctx.fillRect(bx0 - q2 / 2, cy + gap - q2 / 2, q2, q2);

      // masked title between the lines
      ctx.save(); ctx.beginPath(); ctx.rect(-80, cy - gap + 3, W + 160, Math.max(0, gap * 2 - 6)); ctx.clip();
      ctx.fillStyle = C.ink;
      letters('MOTION', cx, cy - 40, F(900, 250), -8, i => {
        const a = E.outExpo(P(t, .88 + i * .045, 1.5 + i * .045));
        const b = E.inExpo(P(t, 1.78 + i * .03, 2.08 + i * .03));
        return { y: (1 - a) * 300 - b * 330 };
      });
      const sub = 'SHOWREEL ── 2026 ── MOTION DESIGN';
      ctx.font = MONO(24); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.globalAlpha = 1 - P(t, 1.8, 2.0);
      typeText(sub, cx - ctx.measureText(sub).width / 2, cy + 132, P(t, 1.15, 1.6));
      ctx.restore();
    }
  }

  // circle wipe into scene 2
  const rw = E.inOutExpo(P(t, 1.95, 2.4));
  if (rw > 0) {
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.globalAlpha = 1 - P(t, 2.25, 2.45);
    ctx.beginPath(); ctx.arc(cx, cy, rw * 1150, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
  }
  const cw = E.inOutExpo(P(t, 2.02, 2.5));
  if (cw > 0) { ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(cx, cy, cw * 1160, 0, TAU); ctx.fill(); }
}

/* =========================================================
   SCENE 2 — FORM  (2.5 – 5s)  morphing shape grid
   ========================================================= */
const SHAPES = [[1, 1, .08], [1, 1, .5], [1.25, .26, .5]]; // square → circle → pill
function s2(u) {
  bgFill(C.red);
  const cs = 120;
  for (let j = 0; j < 9; j++) for (let i = 0; i < 16; i++) {
    const x = i * cs + 60, y = j * cs + 60;
    const d = Math.hypot(x - W / 2, y - H / 2) / 1100;
    const sIn = E.outBack(P(u, d * .6, d * .6 + .45));
    const sOut = E.inExpo(P(u, 1.8 + (1 - d) * .3, 2.12 + (1 - d) * .3));
    const s = sIn * (1 - sOut);
    if (s <= .001) continue;

    const loc = u - d * .5;
    let k = 0, f = 0, pulse = 0;
    if (loc > 0) { k = Math.floor(loc / BEAT); const lb = loc - k * BEAT; f = E.inOutCubic(clamp(lb / .32)); pulse = Math.exp(-lb * 9); }
    const A = SHAPES[k % 3], B = SHAPES[(k + 1) % 3];
    const size = 66 * s * (1 + .18 * pulse);
    const w = size * lerp(A[0], B[0], f), h = size * lerp(A[1], B[1], f), r = Math.min(w, h) * lerp(A[2], B[2], f);
    const dir = (i + j) % 2 ? 1 : -1;
    const hv = hash(i * 31 + j * 17);

    ctx.save(); ctx.translate(x, y); ctx.rotate((k + f) * Math.PI / 2 * dir);
    rrect(-w / 2, -h / 2, w, h, r);
    if (hv < .1) { ctx.strokeStyle = C.ink; ctx.lineWidth = 6 * s; ctx.stroke(); }
    else { ctx.fillStyle = hv < .24 ? C.bg : hv < .3 ? C.yel : C.ink; ctx.fill(); }
    ctx.restore();
  }
  // stripe wipe out
  ctx.fillStyle = C.bg;
  for (let j = 0; j < 9; j++) {
    const e = E.inOutExpo(P(u, 1.85 + j * .03, 2.2 + j * .03));
    if (e > 0) ctx.fillRect(-80, j * cs - 1, (W + 160) * e, cs + 2);
  }
}

/* =========================================================
   SCENE 3 — PARTICLES  (5 – 7.5s)
   ========================================================= */
const BK = [{ c: C.red, ps: [] }, { c: C.org, ps: [] }, { c: C.yel, ps: [] }, { c: C.ink, ps: [] }];
let PCOUNT = 0, TXT_FS = 330;
function buildParticles() {
  const r = rng(7), oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  const g = oc.getContext('2d');
  g.font = F(900, TXT_FS);
  const mw = g.measureText('KINETIC').width;
  if (mw > W - 220) TXT_FS *= (W - 220) / mw;
  g.font = F(900, TXT_FS); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  g.fillText('KINETIC', W / 2, H / 2);
  const d = g.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += 6) for (let x = 0; x < W; x += 6) if (d[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
  for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
  pts.length = Math.min(pts.length, 4200);
  for (const [px, py] of pts) {
    const x = px + (r() - .5) * 4, y = py + (r() - .5) * 4, dx = x - W / 2, dy = y - H / 2;
    const p = {
      r1: Math.hypot(dx, dy), a1: Math.atan2(dy, dx), r0: 1100 + r() * 800, sw: 2 + r() * 2.5,
      d: r() * .2 + (x / W) * .2, ph: r() * TAU, ea: Math.atan2(dy, dx) + (r() - .5) * .8, sp: 500 + r() * 1700
    };
    const q = r(), nx = x / W;
    BK[q < .15 ? 3 : nx < .38 ? 0 : nx < .64 ? 1 : 2].ps.push(p);
  }
  PCOUNT = pts.length;
}
const _a = [0, 0], _b = [0, 0];
function ppos(p, u, o) {
  const e = E.outExpo(P(u, p.d, p.d + 1));
  const ang = p.a1 + (1 - e) * p.sw, r = lerp(p.r0, p.r1, e);
  let x = Math.cos(ang) * r + Math.sin(u * 5 + p.ph) * 1.3 * e;
  let y = Math.sin(ang) * r + Math.cos(u * 4 + p.ph) * 1.3 * e;
  const an = 1 - .09 * E.inOutCubic(P(u, 1.82, 2.0)); // anticipation
  x *= an; y *= an;
  const ex = P(u, 2.0, 2.5);
  if (ex > 0) { const k = E.outCubic(ex) * p.sp; x += Math.cos(p.ea) * k; y += Math.sin(p.ea) * k; }
  o[0] = W / 2 + x; o[1] = H / 2 + y;
}
function s3(u) {
  bgFill(C.bg);
  const cx = W / 2, cy = H / 2;
  const gl = P(u, .6, 1.5) * (1 - P(u, 2.0, 2.4));
  if (gl > 0) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 950);
    g.addColorStop(0, `rgba(255,61,46,${.24 * gl})`); g.addColorStop(1, 'rgba(255,61,46,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  ctx.lineWidth = 2.6 + (u > 1.5 ? 2.4 * Math.exp(-(u - 1.5) * 6) : 0);
  for (const b of BK) {
    ctx.strokeStyle = b.c; ctx.beginPath();
    for (const p of b.ps) {
      ppos(p, u, _a); ppos(p, u - .03, _b);
      let dx = _a[0] - _b[0], dy = _a[1] - _b[1];
      if (dx * dx + dy * dy < .3) dx = .6;
      ctx.moveTo(_a[0] - dx, _a[1] - dy); ctx.lineTo(_a[0], _a[1]);
    }
    ctx.stroke();
  }
  // impact slam w/ chromatic split
  const sa = P(u, 1.5, 1.51) * (1 - E.outCubic(P(u, 1.55, 1.95)));
  if (sa > 0) {
    const o = 28 * (1 - E.outExpo(P(u, 1.5, 1.9))), sc = lerp(1.1, 1, E.outExpo(P(u, 1.5, 1.8)));
    ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.globalAlpha = sa;
    ctx.font = F(900, TXT_FS); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ff0033'; ctx.fillText('KINETIC', -o, 0);
    ctx.fillStyle = '#0044ff'; ctx.fillText('KINETIC', o, 0);
    ctx.fillStyle = '#66ff99'; ctx.globalAlpha = sa * .6; ctx.fillText('KINETIC', 0, o * .4);
    ctx.restore();
  }
  ctx.restore();
  // shockwave
  const sw = P(u, 1.5, 2.2);
  if (sw > 0 && sw < 1) {
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3 * (1 - sw); ctx.globalAlpha = 1 - sw;
    ctx.beginPath(); ctx.arc(cx, cy, E.outExpo(sw) * 1100, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = C.ink; ctx.font = MONO(18); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = .7 * (1 - P(u, 1.9, 2.05));
  const lab = `${PCOUNT.toLocaleString('en-US')} PARTICLES · POLAR SWIRL CONVERGENCE · MOTION-BLUR STREAKS`;
  typeText(lab, cx - ctx.measureText(lab).width / 2, H - 170, P(u, .3, .9));
  ctx.globalAlpha = 1;
}

/* =========================================================
   SCENE 4 — DIMENSION  (7.5 – 10s)  3D point morphs
   ========================================================= */
const N3 = 1700;
const SC = new Float32Array(N3 * 3), SP = new Float32Array(N3 * 3), TO = new Float32Array(N3 * 3), KN = new Float32Array(N3 * 3), R4 = new Float32Array(N3);
function build3D() {
  const r = rng(42);
  for (let i = 0; i < N3; i++) {
    const k = i * 3;
    R4[i] = r();
    // scatter shell
    const th = r() * TAU, ph = Math.acos(2 * r() - 1), rr = 1400 + r() * 1000;
    SC[k] = Math.sin(ph) * Math.cos(th) * rr; SC[k + 1] = Math.cos(ph) * rr; SC[k + 2] = Math.sin(ph) * Math.sin(th) * rr;
    // fibonacci sphere
    const y = 1 - 2 * (i + .5) / N3, rad = Math.sqrt(1 - y * y), a = i * 2.399963;
    SP[k] = Math.cos(a) * rad * 330; SP[k + 1] = y * 330; SP[k + 2] = Math.sin(a) * rad * 330;
    // torus
    const u = i / N3 * TAU, v = (i * .618034 % 1) * TAU * 1;
    const tu = u * 1, tv = v;
    TO[k] = (300 + 105 * Math.cos(tv)) * Math.cos(tu * 1); TO[k + 1] = 105 * Math.sin(tv); TO[k + 2] = (300 + 105 * Math.cos(tv)) * Math.sin(tu);
    // trefoil knot tube
    const s = i / N3 * TAU, jt = r() * TAU, jp = Math.acos(2 * r() - 1), jr = 26;
    KN[k] = (Math.sin(s) + 2 * Math.sin(2 * s)) * 105 + Math.sin(jp) * Math.cos(jt) * jr;
    KN[k + 1] = (Math.cos(s) - 2 * Math.cos(2 * s)) * 105 + Math.cos(jp) * jr;
    KN[k + 2] = -Math.sin(3 * s) * 105 + Math.sin(jp) * Math.sin(jt) * jr;
  }
}
const RC = { cy: 1, sy: 0, cx: 1, sx: 0, cam: 1100, f: 1000 };
const _p = [0, 0, 0], _q = [0, 0, 0];
function proj(x, y, z, o) {
  const x1 = x * RC.cy - z * RC.sy, z1 = x * RC.sy + z * RC.cy;
  const y1 = y * RC.cx - z1 * RC.sx, z2 = y * RC.sx + z1 * RC.cx;
  const zc = z2 + RC.cam;
  if (zc < 25) { o[2] = -1; return; }
  const s = RC.f / zc; o[0] = W / 2 + x1 * s; o[1] = H / 2 + y1 * s; o[2] = s;
}
function s4(u) {
  bgFill('#05060c');
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 1000);
  g.addColorStop(0, '#18214d'); g.addColorStop(1, 'rgba(5,6,12,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const zoom = E.inExpo(P(u, 1.9, 2.5));
  const ry = u * .8 + zoom * 2.4, rx = .38 + .22 * Math.sin(u * 1.4);
  RC.cy = Math.cos(ry); RC.sy = Math.sin(ry); RC.cx = Math.cos(rx); RC.sx = Math.sin(rx);
  RC.cam = lerp(1100, -300, zoom);

  // floor grid
  const fa = .13 * (1 - P(u, 1.8, 2.1)) * P(u, .1, .6);
  if (fa > 0) {
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1; ctx.globalAlpha = fa; ctx.beginPath();
    for (let a = -6; a <= 6; a++) for (let axis = 0; axis < 2; axis++) {
      for (let s = 0; s < 12; s++) {
        const t0 = -1500 + s * 250, t1 = t0 + 250, c = a * 250;
        axis ? (proj(c, 470, t0, _p), proj(c, 470, t1, _q)) : (proj(t0, 470, c, _p), proj(t1, 470, c, _q));
        if (_p[2] > 0 && _q[2] > 0) { ctx.moveTo(_p[0], _p[1]); ctx.lineTo(_q[0], _q[1]); }
      }
    }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  // orbit rings
  for (let rI = 0; rI < 2; rI++) {
    const tilt = rI ? -.9 : .6, rad = rI ? 560 : 470, ra = .35 * P(u, .2, .8) * (1 - P(u, 1.85, 2.1));
    if (ra <= 0) continue;
    ctx.strokeStyle = rI ? C.red : C.ink; ctx.globalAlpha = ra; ctx.lineWidth = 1.5; ctx.beginPath();
    let first = true;
    for (let k = 0; k <= 96; k++) {
      const a = k / 96 * TAU, x = Math.cos(a) * rad, z = Math.sin(a) * rad;
      proj(x * Math.cos(tilt), x * Math.sin(tilt), z, _p);
      if (_p[2] < 0) { first = true; continue; }
      first ? ctx.moveTo(_p[0], _p[1]) : ctx.lineTo(_p[0], _p[1]); first = false;
    }
    ctx.stroke();
    const sa = u * (rI ? -2.2 : 1.7), sx = Math.cos(sa) * rad, sz = Math.sin(sa) * rad;
    proj(sx * Math.cos(tilt), sx * Math.sin(tilt), sz, _p);
    if (_p[2] > 0) { ctx.globalAlpha = ra * 2.5; ctx.fillStyle = rI ? C.red : C.ink; ctx.beginPath(); ctx.arc(_p[0], _p[1], 6 * _p[2], 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  }

  // points
  const breath = 1 + .06 * Math.exp(-((u % BEAT)) * 8);
  let trk = null;
  for (let i = 0; i < N3; i++) {
    const k = i * 3, d = R4[i] * .15;
    const a = E.outExpo(P(u, d, .75 + d)), b = E.inOutExpo(P(u, .6 + d, .92 + d)), c = E.inOutExpo(P(u, 1.1 + d, 1.42 + d));

  at(5.2, tm => riser(tm, 1.3));
  at(6.5, tm => { impact(tm, 1.1); stab(tm, [220, 329.63, 440], .25); });
  at(6.8, tm => whoosh(tm, .2, 800, 6000, .2));
  at(7, tm => { kick(tm, 1); whoosh(tm, .5, 6000, 200, .35); });
  // S4
  at(7.5, tm => impact(tm, 1));
  for (let i = 0; i < 16; i++) at(7.5 + i * .125, tm => hat(tm, i % 2 ? .1 : .22));
  [8, 8.5, 9, 9.5].forEach(t => at(t, tm => kick(tm, 1)));
  [8, 9].forEach(t => at(t, tm => snare(tm, .45)));
  at(8.5, tm => stab(tm, [261.63, 392, 523.25], .3));
  at(9, tm => stab(tm, [293.66, 440, 587.33], .3));
  [55, 55, 82.41, 55, 98, 55, 82.41, 73.42].forEach((f, i) => at(7.5 + i * .25, tm => bass(tm, f, .2)));
  at(9.5, tm => { riser(tm, .5); whoosh(tm, .5, 200, 8000, .35); });
  [9.5, 9.625, 9.75, 9.875].forEach((t, i) => at(t, tm => snare(tm, .2 + i * .12)));
  // S5
  for (let i = 0; i < 10; i++) at(10 + i * .25, tm => { kick(tm, i ? .85 : 1.1); stab(tm, [PENT[i], PENT[i] * 1.5], .16); if (i % 2) snare(tm, .35); hat(tm + .125, .2); });
  // S6
  at(12.5, tm => { impact(tm, 1.2); pad(tm, [110, 220, 261.63, 329.63, 392, 493.88], 2.4, .06); });
  at(12.6, tm => whoosh(tm, .55, 300, 3000, .15));
  at(12.95, tm => blip(tm, 1318.5, .2));
  for (let i = 0; i < 8; i++) at(13.3 + i * .045, tm => hat(tm, .1));
  at(14.4, tm => whoosh(tm, .45, 5000, 150, .25));
  at(14.85, tm => blip(tm, 440, .2));
  return ev.sort((a, b) => a.t - b.t);
}
const EV = buildEvents(), sched = { loop: 0, idx: 0 };
setInterval(() => {
  if (!soundOn || clock.paused) return;
  const ahead = actx.currentTime + .25;
  for (;;) {
    const ev = EV[sched.idx], tm = audioStart + sched.loop * DUR + ev.t;
    if (tm > ahead) break;
    if (tm >= actx.currentTime - .03) ev.f(Math.max(tm, actx.currentTime));
    if (++sched.idx >= EV.length) { sched.idx = 0; sched.loop++; }
  }
}, 25);

/* =========================================================
   CLOCK / LOOP / CONTROLS
   ========================================================= */
const clock = { base: performance.now() / 1000, paused: false, pt: 0 };
function reelTime() {
  if (clock.paused) return clock.pt;
  const raw = soundOn ? actx.currentTime - audioStart : performance.now() / 1000 - clock.base;
  return raw < 0 ? 0 : raw % DUR;
}
function restart() {
  clock.paused = false;
  if (soundOn) { if (actx.state === 'suspended') actx.resume(); newSession(); audioStart = actx.currentTime + .06; sched.loop = 0; sched.idx = 0; }
  else clock.base = performance.now() / 1000;
}
function togglePause() {
  if (!clock.paused) { clock.pt = reelTime(); clock.paused = true; if (soundOn) actx.suspend(); }
  else { clock.paused = false; if (soundOn) actx.resume(); else clock.base = performance.now() / 1000 - clock.pt; }
}
const bSnd = document.getElementById('snd');
function toggleSound() {
  if (!actx) { initAudio(); soundOn = true; restart(); }
  else { muted = !muted; master.gain.setTargetAtTime(muted ? 0 : .9, actx.currentTime, .02); }
  bSnd.classList.remove('hint'); bSnd.textContent = muted ? '♪ SOUND OFF' : '♪ SOUND ON';
}
bSnd.onclick = toggleSound;
document.getElementById('rst').onclick = restart;
const fsToggle = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
document.getElementById('fs').onclick = fsToggle;
cv.onclick = togglePause;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') restart();
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'f' || e.key === 'F') fsToggle();
});
const ui = document.getElementById('ui'); let idleT;
const wake = () => { ui.classList.remove('hide'); clearTimeout(idleT); idleT = setTimeout(() => ui.classList.add('hide'), 2600); };
addEventListener('mousemove', wake); wake();

function render(t) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const [sx, sy] = shake(t);
  ctx.save(); ctx.translate(sx, sy);
  if (t < 2.5) s1(t);
  else if (t < 5) s2(t - 2.5);
  else if (t < 7.5) s3(t - 5);
  else if (t < 10) s4(t - 7.5);
  else if (t < 12.5) s5(t - 10);
  else s6(t - 12.5);
  ctx.restore();
  post(); hud(t);
}
buildParticles(); build3D();
(function frame() { render(reelTime()); requestAnimationFrame(frame); })();
</script>
