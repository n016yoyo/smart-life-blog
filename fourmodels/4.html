<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비 오는 밤의 도시</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: rgba(200, 215, 255, .35); font: 12px/1 system-ui, sans-serif;
    letter-spacing: .08em; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">화면을 누르면 번개가 칩니다</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W, H, DPR, S, groundY;
let layers = [], clouds = [], lamps = [], rain = [], splashes = [], ripples = [], cars = [];
let vignette;
let bolt = null, flash = 0, time = 0, nextStrike = 3, nextCar = 1.5;

const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.random() * arr.length | 0];
const mix = (a, b, t) =>
  `rgb(${a[0] + (b[0] - a[0]) * t | 0},${a[1] + (b[1] - a[1]) * t | 0},${a[2] + (b[2] - a[2]) * t | 0})`;

// 시드 고정 난수: 창 크기가 바뀌어도 같은 모양의 도시가 나오게
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const WARM = ['#ffd27a', '#ffc35c', '#ffe3a3', '#ffb347', '#fff1c9'];
const COOL = ['#9fd4ff', '#bfe3ff', '#8ab6ff'];

// ---------- 장면 구성 ----------

function buildCity() {
  const rnd = mulberry32(20261017);
  const r = (a, b) => a + rnd() * (b - a);
  const defs = [
    // 먼 빌딩 → 가까운 빌딩
    { body: [24, 30, 52], minH: .24, maxH: .52, minW: 30, maxW: 66,  ww: 2.4, wh: 3,  gx: 5, gy: 7,  lit: .26, gap: [-10, 4], alpha: .55, drawDark: false },
    { body: [14, 19, 35], minH: .16, maxH: .46, minW: 48, maxW: 100, ww: 4,   wh: 6,  gx: 6, gy: 8,  lit: .34, gap: [-6, 12], alpha: .8,  drawDark: false },
    { body: [7, 9, 16],   minH: .10, maxH: .34, minW: 85, maxW: 170, ww: 8,   wh: 11, gx: 9, gy: 12, lit: .42, gap: [6, 46],  alpha: 1,   drawDark: true },
  ];
  layers = defs.map(d => {
    const bs = [];
    let x = -r(0, 40) * S;
    while (x < W) {
      const w = r(d.minW, d.maxW) * S;
      const h = r(d.minH, d.maxH) * H;
      const b = { x, w, h, top: groundY - h, roof: 0, wins: [], phase: r(0, 6.28) };
      const roll = rnd();
      if (roll < .22) { b.roof = 1; b.antX = x + w * r(.25, .75); b.antH = r(18, 60) * S; }
      else if (roll < .5) { b.roof = 2; b.capW = w * r(.4, .7); b.capH = h * r(.05, .12); b.capX = x + (w - b.capW) * r(.2, .8); }

      const ww = d.ww * S, wh = d.wh * S, gx = d.gx * S, gy = d.gy * S;
      const padX = Math.max(gx, w * .08), padY = gy * 1.5;
      const cols = Math.floor((w - padX * 2 + gx) / (ww + gx));
      const rows = Math.floor((h - padY * 2 + gy) / (wh + gy));
      const offX = x + (w - (cols * (ww + gx) - gx)) / 2;
      const busy = r(.6, 1.4); // 건물마다 불 켜진 정도를 다르게
      for (let cy = 0; cy < rows; cy++) {
        for (let cx = 0; cx < cols; cx++) {
          const cool = rnd() < .14;
          b.wins.push({
            x: offX + cx * (ww + gx), y: b.top + padY + cy * (wh + gy), w: ww, h: wh,
            on: rnd() < d.lit * busy,
            col: cool ? COOL[rnd() * COOL.length | 0] : WARM[rnd() * WARM.length | 0],
            br: r(.55, 1), tv: rnd() < .03, t: r(2, 40), busy,
          });
        }
      }
      bs.push(b);
      x += w + r(d.gap[0], d.gap[1]) * S;
    }
    return { ...d, bs };
  });
}

function buildClouds() {
  clouds = [];
  for (let i = 0; i < 14; i++) {
    const rx = rand(160, 420) * S;
    clouds.push({ x: rand(-rx, W + rx), y: rand(-.06, .3) * H, rx, ry: rx * rand(.25, .4), v: rand(4, 14) * S, a: rand(.25, .45) });
  }
}

function buildLamps() {
  const n = Math.max(2, Math.round(W / 420));
  lamps = [];
  for (let i = 0; i < n; i++) {
    lamps.push({ x: (i + .5) * W / n + rand(-30, 30) * S, h: H * .17, flicker: i === 1 });
  }
}

function makeDrop(initial) {
  const z = rand(.3, 1);
  const speed = (650 + z * 750) * S;
  return {
    x: rand(-W * .2, W * 1.05),
    y: initial ? rand(-H * .2, H) : rand(-H * .25, -10),
    z, speed, len: (10 + z * 22) * S,
    hitY: groundY + (H - groundY) * ((z - .3) / .7) * .97,
  };
}

function buildRain() {
  const n = Math.min(1100, Math.round(W * H / 1900));
  rain = Array.from({ length: n }, () => makeDrop(true));
  splashes = []; ripples = [];
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.max(.55, H / 900);
  groundY = Math.round(H * .78);
  vignette = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .35, W / 2, H * .45, Math.max(W, H) * .8);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,.55)');
  buildCity(); buildClouds(); buildLamps(); buildRain();
  cars = [];
}

// ---------- 번개 ----------

const FLASH = [[0, 0], [.03, 1], [.09, .2], [.14, .85], [.22, .3], [.3, .55], [.7, .06], [1.4, 0]];
function flashAt(t) {
  for (let i = 1; i < FLASH.length; i++) {
    if (t < FLASH[i][0]) {
      const [t0, v0] = FLASH[i - 1], [t1, v1] = FLASH[i];
      return v0 + (v1 - v0) * (t - t0) / (t1 - t0);
    }
  }
  return 0;
}

function strike() {
  const x0 = rand(W * .12, W * .88);
  const endY = groundY - rand(.04, .22) * H;
  const main = [[x0, -20]];
  let x = x0, y = -20;
  while (y < endY) {
    y += rand(6, 18) * S;
    x += rand(-12, 12) * S;
    main.push([x, y]);
  }
  const paths = [{ pts: main, width: 2.6 }];
  const branches = 3 + (Math.random() * 4 | 0);
  for (let i = 0; i < branches; i++) {
    const p = main[Math.random() * main.length * .7 | 0];
    const dir = Math.random() < .5 ? -1 : 1;
    let bx = p[0], by = p[1];
    const pts = [[bx, by]];
    const n = 6 + (Math.random() * 16 | 0);
    for (let k = 0; k < n; k++) {
      by += rand(5, 14) * S;
      bx += dir * rand(2, 12) * S + rand(-5, 5) * S;
      pts.push([bx, by]);
    }
    paths.push({ pts, width: 1.1 });
  }
  bolt = { paths, x: x0, t: 0 };
}

function drawBolt() {
  if (!bolt || bolt.t > .5) return;
  const a = Math.min(1, flash * 1.2);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (const p of bolt.paths) {
    ctx.beginPath();
    ctx.moveTo(p.pts[0][0], p.pts[0][1]);
    for (let i = 1; i < p.pts.length; i++) ctx.lineTo(p.pts[i][0], p.pts[i][1]);
    ctx.strokeStyle = `rgba(150,140,255,${.18 * a})`;
    ctx.lineWidth = p.width * 7 * S;
    ctx.stroke();
    ctx.strokeStyle = `rgba(210,205,255,${.5 * a})`;
    ctx.lineWidth = p.width * 2.5 * S;
    ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a})`;
    ctx.lineWidth = p.width * S;
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- 갱신 ----------

function update(dt) {
  for (const c of clouds) {
    c.x += c.v * dt;
    if (c.x - c.rx > W) c.x = -c.rx;
  }

  for (const L of layers) {
    for (const b of L.bs) {
      for (const w of b.wins) {
        w.t -= dt;
        if (w.t <= 0) {
          w.on = Math.random() < L.lit * w.busy;
          w.t = rand(4, 45);
        }
      }
    }
  }

  const wind = .16 + .06 * Math.sin(time * .35);
  for (let i = 0; i < rain.length; i++) {
    const d = rain[i];
    d.x += d.speed * wind * dt;
    d.y += d.speed * dt;
    if (d.y >= d.hitY) {
      if (d.hitY > groundY + 3 && d.x > 0 && d.x < W) {
        if (d.z > .45 && Math.random() < .5 && ripples.length < 160) {
          ripples.push({ x: d.x, y: d.hitY, r: 0, max: (4 + d.z * 10) * S, life: 1 });
        }
        if (d.z > .7 && Math.random() < .55 && splashes.length < 300) {
          const n = 2 + (Math.random() * 2 | 0);
          for (let k = 0; k < n; k++) {
            splashes.push({ x: d.x, y: d.hitY, vx: rand(-60, 60) * S, vy: -rand(60, 150) * S, life: 1 });
          }
        }
      }
      rain[i] = makeDrop(false);
    }
  }

  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i];
    s.vy += 900 * S * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.life -= dt * 3;
    if (s.life <= 0) splashes.splice(i, 1);
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const p = ripples[i];
    p.life -= dt * 2.2;
    p.r = p.max * (1 - p.life);
    if (p.life <= 0) ripples.splice(i, 1);
  }

  nextCar -= dt;
  if (nextCar <= 0) {
    const dir = Math.random() < .5 ? 1 : -1;
    cars.push({
      dir, x: dir > 0 ? -200 * S : W + 200 * S,
      v: rand(160, 280) * S,
      y: groundY + (H - groundY) * (dir > 0 ? .62 : .36),
      tail: pick(['#ff3b3b', '#ff4d4d']),
    });
    nextCar = rand(3, 8);
  }
  for (let i = cars.length - 1; i >= 0; i--) {
    const c = cars[i];
    c.x += c.v * c.dir * dt;
    if (c.x < -260 * S || c.x > W + 260 * S) cars.splice(i, 1);
  }
}

// ---------- 그리기 ----------

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, mix([4, 5, 12], [70, 72, 118], flash));
  g.addColorStop(.6, mix([12, 15, 32], [120, 115, 175], flash));
  g.addColorStop(1, mix([46, 36, 62], [178, 168, 215], flash));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, groundY);
}

function drawClouds() {
  const bx = bolt ? bolt.x : W / 2;
  for (const c of clouds) {
    const near = Math.exp(-(((c.x - bx) / (W * .3)) ** 2));
    const lit = flash * (.35 + .65 * near);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(1, c.ry / c.rx);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, c.rx);
    const col = mix([36, 40, 64], [190, 182, 235], lit);
    g.addColorStop(0, col.replace('rgb', 'rgba').replace(')', `,${c.a + lit * .3})`));
    g.addColorStop(1, col.replace('rgb', 'rgba').replace(')', ',0)'));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, c.rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawLayer(L, li) {
  const body = mix(L.body, [70, 74, 110], flash * (.5 - li * .2));
  for (const b of L.bs) {
    ctx.fillStyle = body;
    ctx.fillRect(b.x, b.top, b.w, groundY - b.top + 1);
    if (b.roof === 2) ctx.fillRect(b.capX, b.top - b.capH, b.capW, b.capH + 1);
    if (b.roof === 1) {
      ctx.fillRect(b.antX - S, b.top - b.antH, 2 * S, b.antH);
      // 항공 장애등
      const on = Math.sin(time * 2.2 + b.phase) > .55;
      if (on) {
        const ax = b.antX, ay = b.top - b.antH;
        const g = ctx.createRadialGradient(ax, ay, 0, ax, ay, 10 * S);
        g.addColorStop(0, 'rgba(255,60,60,.9)');
        g.addColorStop(1, 'rgba(255,60,60,0)');
        ctx.fillStyle = g;
        ctx.fillRect(ax - 10 * S, ay - 10 * S, 20 * S, 20 * S);
        ctx.fillStyle = body;
      }
    }
    // 도시 불빛이 비친 왼쪽 가장자리
    ctx.fillStyle = `rgba(130,140,200,${.06 + flash * .2})`;
    ctx.fillRect(b.x, b.top, 1.2 * S, groundY - b.top);

    for (const w of b.wins) {
      if (!w.on) {
        if (L.drawDark) {
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#10141f';
          ctx.fillRect(w.x, w.y, w.w, w.h);
        }
        continue;
      }
      let a = w.br * L.alpha;
      if (w.tv) a *= .5 + .5 * Math.abs(Math.sin(time * 9 + w.x * .13) * Math.sin(time * 3.3 + w.y));
      ctx.fillStyle = w.tv ? '#8fb8ff' : w.col;
      if (L.drawDark) {
        ctx.globalAlpha = a * .09;
        ctx.fillRect(w.x - 4 * S, w.y - 4 * S, w.w + 8 * S, w.h + 8 * S);
      }
      ctx.globalAlpha = a;
      ctx.fillRect(w.x, w.y, w.w, w.h);
    }
    ctx.globalAlpha = 1;
  }
}

function drawHaze(strength) {
  const g = ctx.createLinearGradient(0, groundY - H * .4, 0, groundY);
  const c = mix([28, 32, 58], [150, 145, 195], flash);
  g.addColorStop(0, c.replace('rgb', 'rgba').replace(')', ',0)'));
  g.addColorStop(1, c.replace('rgb', 'rgba').replace(')', `,${strength})`));
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY - H * .4, W, H * .4);
}

function drawLampPosts() {
  for (const l of lamps) {
    const top = groundY - l.h;
    const hx = l.x + 20 * S, hy = top + 5 * S;
    ctx.fillStyle = '#04060a';
    ctx.fillRect(l.x - 1.6 * S, top, 3.2 * S, l.h);
    ctx.fillRect(l.x, top, 24 * S, 3 * S);
    ctx.fillRect(hx - 7 * S, top + 2 * S, 14 * S, 4 * S);

    let k = 1;
    if (l.flicker) k = Math.sin(time * 23) > -.85 ? 1 : .25;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 60 * S);
    g.addColorStop(0, `rgba(255,205,130,${.55 * k})`);
    g.addColorStop(1, 'rgba(255,205,130,0)');
    ctx.fillStyle = g;
    ctx.fillRect(hx - 60 * S, hy - 60 * S, 120 * S, 120 * S);
    // 빗속의 빛 원뿔
    const cone = ctx.createLinearGradient(0, hy, 0, groundY);
    cone.addColorStop(0, `rgba(255,195,115,${.16 * k})`);
    cone.addColorStop(1, 'rgba(255,195,115,0)');
    ctx.fillStyle = cone;
    ctx.beginPath();
    ctx.moveTo(hx - 6 * S, hy);
    ctx.lineTo(hx + 6 * S, hy);
    ctx.lineTo(hx + 75 * S, groundY);
    ctx.lineTo(hx - 75 * S, groundY);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    l.k = k;
  }
}

function drawGround() {
  ctx.fillStyle = '#04060b';
  ctx.fillRect(0, groundY, W, H - groundY);

  // 젖은 노면 반사: 윗부분을 띠 단위로 뒤집어 그리며 물결처럼 흔든다
  const refH = H - groundY;
  const step = 2;
  for (let k = 0; k < refH; k += step) {
    const srcY = groundY - k - step;
    if (srcY < 0) break;
    const off = Math.sin(k * .35 + time * 3) * (1 + k * .05) * S;
    ctx.globalAlpha = .42 * (1 - k / refH);
    ctx.drawImage(canvas, 0, srcY * DPR, W * DPR, step * DPR, off, groundY + k, W, step);
  }
  ctx.globalAlpha = 1;

  const g = ctx.createLinearGradient(0, groundY, 0, H);
  g.addColorStop(0, 'rgba(20,26,45,.15)');
  g.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY, W, refH);

  // 인도 경계선과 차선
  ctx.fillStyle = `rgba(140,150,190,${.14 + flash * .3})`;
  ctx.fillRect(0, groundY, W, 2 * S);
  ctx.fillStyle = 'rgba(200,190,140,.08)';
  const laneY = groundY + refH * .49;
  for (let x = 0; x < W; x += 80 * S) ctx.fillRect(x, laneY, 40 * S, 2 * S);

  // 가로등 빛 웅덩이
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const l of lamps) {
    const hx = l.x + 20 * S, py = groundY + 14 * S;
    ctx.save();
    ctx.translate(hx, py);
    ctx.scale(1, .18);
    const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, 110 * S);
    pg.addColorStop(0, `rgba(255,190,110,${.35 * l.k})`);
    pg.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(0, 0, 110 * S, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawCars() {
  for (const c of cars) {
    const len = 120 * S, hgt = 18 * S;
    const front = c.dir > 0 ? c.x + len / 2 : c.x - len / 2;
    const back = c.dir > 0 ? c.x - len / 2 : c.x + len / 2;
    const top = c.y - hgt;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // 노면에 길게 번지는 불빛 반사
    for (const [lx, col] of [[front, '255,235,190'], [back, '255,60,60']]) {
      const rg = ctx.createLinearGradient(0, c.y, 0, c.y + (H - c.y) * .9);
      rg.addColorStop(0, `rgba(${col},.35)`);
      rg.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = rg;
      ctx.fillRect(lx - 5 * S, c.y, 10 * S, (H - c.y) * .9);
    }
    // 전조등 빔
    const bx = front + c.dir * 220 * S;
    const bg = ctx.createLinearGradient(front, 0, bx, 0);
    bg.addColorStop(0, 'rgba(255,240,200,.28)');
    bg.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(front, c.y - 8 * S);
    ctx.lineTo(bx, c.y - 26 * S);
    ctx.lineTo(bx, c.y + 6 * S);
    ctx.lineTo(front, c.y - 4 * S);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 차체
    ctx.fillStyle = '#06080e';
    ctx.fillRect(c.x - len / 2, top, len, hgt);
    ctx.beginPath();
    const cab = len * .28;
    ctx.moveTo(c.x - (cab + 12 * S) * c.dir, top);
    ctx.lineTo(c.x - cab * .7 * c.dir, top - 15 * S);
    ctx.lineTo(c.x + cab * .5 * c.dir, top - 15 * S);
    ctx.lineTo(c.x + cab * c.dir + 10 * S * c.dir, top);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,210,140,.12)';
    ctx.fillRect(Math.min(c.x - cab * .6 * c.dir, c.x + cab * .4 * c.dir), top - 12 * S, Math.abs(cab * 1.0), 9 * S);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const [lx, r, col] of [[front, 22, '255,240,200'], [back, 16, '255,50,50']]) {
      const g = ctx.createRadialGradient(lx, c.y - 7 * S, 0, lx, c.y - 7 * S, r * S);
      g.addColorStop(0, `rgba(${col},.9)`);
      g.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = g;
      ctx.fillRect(lx - r * S, c.y - 7 * S - r * S, r * 2 * S, r * 2 * S);
    }
    ctx.restore();
  }
}

function drawRain() {
  const wind = .16 + .06 * Math.sin(time * .35);
  const norm = 1 / Math.hypot(wind, 1);
  const buckets = [
    { max: .55, color: [165, 180, 220], a: .16, w: .8 },
    { max: .8,  color: [175, 190, 230], a: .26, w: 1.1 },
    { max: 1.01, color: [190, 205, 240], a: .4, w: 1.5 },
  ];
  ctx.lineCap = 'round';
  let lo = 0;
  for (const bk of buckets) {
    ctx.beginPath();
    for (const d of rain) {
      if (d.z < lo || d.z >= bk.max) continue;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - wind * norm * d.len, d.y - norm * d.len);
    }
    const a = Math.min(.9, bk.a * (1 + flash * 1.6));
    ctx.strokeStyle = `rgba(${bk.color.join(',')},${a})`;
    ctx.lineWidth = bk.w * S;
    ctx.stroke();
    lo = bk.max;
  }

  ctx.strokeStyle = 'rgba(170,185,225,.35)';
  ctx.lineWidth = .8 * S;
  for (const p of ripples) {
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r, p.r * .28, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgb(200,212,240)';
  for (const s of splashes) {
    ctx.globalAlpha = Math.max(0, s.life) * .7;
    ctx.fillRect(s.x, s.y, 1.6 * S, 1.6 * S);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  drawSky();
  drawClouds();
  drawBolt();
  drawLayer(layers[0], 0);
  drawHaze(.45);
  drawLayer(layers[1], 1);
  drawHaze(.35);
  drawLayer(layers[2], 2);
  drawLampPosts();
  drawGround();
  drawCars();
  drawRain();

  if (flash > 0) {
    ctx.fillStyle = `rgba(205,210,255,${flash * .16})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
}

// ---------- 루프 ----------

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  time += dt;

  if (time >= nextStrike) {
    strike();
    nextStrike = time + rand(9, 20);
  }
  if (bolt) {
    bolt.t += dt;
    if (bolt.t > 1.5) bolt = null;
  }
  flash = bolt ? flashAt(bolt.t) * (reduceMotion ? .35 : 1) : 0;

  update(dt);
  draw();
  requestAnimationFrame(frame);
}

let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 120);
});
canvas.addEventListener('pointerdown', () => {
  strike();
  nextStrike = time + rand(9, 20);
});

resize();
requestAnimationFrame(frame);
</script>
</body>
