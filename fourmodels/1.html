<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>비 오는 밤의 도시</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #vig { position: fixed; inset: 0; pointer-events: none;
         background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
          font: 12px/1 system-ui, -apple-system, sans-serif; letter-spacing: .08em;
          color: rgba(200,210,255,.5); pointer-events: none; transition: opacity 2s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hint">클릭하면 번개가 칩니다</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W, H, DPR, groundY, S;
  let clock = 0;

  // 도시는 항상 같은 모양이 나오도록 시드 난수를 쓰고, 그 외에는 Math.random
  function mulberry32(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  let rng = Math.random;
  const R = (a, b) => a + rng() * (b - a);
  const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

  // ---------- 글로우 스프라이트 ----------
  const spr = {};
  function glow(h) {
    if (spr[h]) return spr[h];
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const x = c.getContext('2d');
    const [r, g, b] = rgb(h);
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
    gr.addColorStop(.25, `rgba(${r},${g},${b},.35)`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr;
    x.fillRect(0, 0, 64, 64);
    return spr[h] = c;
  }
  function drawGlow(h, x, y, r, a) {
    ctx.globalAlpha = a;
    ctx.drawImage(glow(h), x - r, y - r, r * 2, r * 2);
  }

  // ---------- 도시 ----------
  const WIN_COLORS = ['#ffd27a', '#ffc15e', '#ffe7a8', '#9fd8ff', '#ff9ad5'];
  const NEON = ['#ff3b8d', '#2fd6ff', '#ffd23b', '#7dff6b', '#b04dff'];
  let layers = [], refl = [], lamps = [], cars = [], clouds = [];

  function build() {
    rng = mulberry32(7);
    groundY = H * 0.84;
    S = Math.max(.7, Math.min(1.5, H / 900));
    refl = []; lamps = [];

    const defs = [
      { rgb: [22, 26, 52], hmin: .22, hmax: .62, wmin: 46, wmax: 100, ww: 3, wh: 4, gx: 5, gy: 7, lit: .28, a: .5, ant: .15, gap: 0 },
      { rgb: [13, 16, 34], hmin: .16, hmax: .50, wmin: 56, wmax: 120, ww: 4, wh: 6, gx: 7, gy: 10, lit: .34, a: .75, ant: .2, gap: .05 },
      { rgb: [5, 6, 14],   hmin: .10, hmax: .38, wmin: 70, wmax: 160, ww: 6, wh: 9, gx: 11, gy: 15, lit: .4, a: 1, ant: .2, gap: .15, near: true, signs: .4 },
    ];

    layers = defs.map(d => {
      const L = { ...d, b: [], signs: [] };
      const ww = d.ww * S, wh = d.wh * S, gx = d.gx * S, gy = d.gy * S, m = 6 * S;
      let x = -30;
      while (x < W + 30) {
        const w = R(d.wmin, d.wmax) * S;
        const h = R(d.hmin, d.hmax) * groundY;
        const bd = { x, w, h, y: groundY - h, wins: [], lb: Math.max(.05, Math.min(.8, d.lit + R(-.15, .2))) };
        if (rng() < .4) bd.cap = { dx: w * R(.15, .35), w: w * R(.3, .5), h: R(8, 24) * S };
        if (rng() < d.ant) {
          bd.ant = { x: x + w * R(.3, .7), h: R(20, 50) * S, ph: rng() * 5 };
          bd.ant.y = bd.y - (bd.cap ? bd.cap.h : 0) - bd.ant.h;
        }
        const cols = Math.floor((w - 2 * m + gx) / (ww + gx));
        const rows = Math.floor((h - 2 * m + gy) / (wh + gy));
        const ox = (w - (cols * (ww + gx) - gx)) / 2;
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const on = rng() < bd.lb;
          bd.wins.push({
            x: Math.round(x + ox + c * (ww + gx)), y: Math.round(bd.y + m + r * (wh + gy)), w: ww, h: wh,
            on, col: WIN_COLORS[Math.floor(rng() * WIN_COLORS.length)],
            tv: rng() < .04, ph: rng() * 10, next: clock + R(0, 100),
          });
        }
        if (d.near) {
          const lit = bd.wins.filter(q => q.on);
          for (let k = 0; k < 2 && lit.length; k++) {
            const q = lit[Math.floor(rng() * lit.length)];
            refl.push({ x: q.x, c: rgb(q.col), w: R(6, 14) * S, a: .5, ph: rng() * 6 });
          }
          if (rng() < d.signs) {
            const col = NEON[Math.floor(rng() * NEON.length)];
            const sg = { x: x + 4 * S, y: bd.y + bd.h * R(.15, .5), w: 6 * S, h: R(40, 90) * S, col, faulty: rng() < .4, ph: rng() * 10 };
            L.signs.push(sg);
            refl.push({ x: sg.x + sg.w / 2, c: rgb(col), w: 16 * S, a: 1, ph: rng() * 6 });
          }
        }
        L.b.push(bd);
        x += w - (d.gap ? 0 : 10 * S) + (rng() < d.gap ? R(10, 40) * S : 0);
      }
      return L;
    });

    // 가로등
    const n = Math.max(3, Math.round(W / 420));
    for (let i = 0; i < n; i++) {
      const x = W * (i + .5) / n + R(-30, 30);
      lamps.push({ x, base: groundY + (H - groundY) * .1 });
      refl.push({ x, c: rgb('#ffcf8a'), w: 10 * S, a: .9, ph: rng() * 6 });
    }

    // 자동차
    cars = [];
    for (let i = 0; i < 4; i++) cars.push(newCar(true));

    // 구름
    clouds = [];
    for (let i = 0; i < 8; i++)
      clouds.push({ x: R(0, W), y: R(H * .02, H * .3), r: R(120, 260) * S, v: R(4, 12), a: R(.35, .7) });

    rng = Math.random;
  }

  function newCar(init) {
    const dir = Math.random() < .5 ? 1 : -1;
    const y = groundY + (H - groundY) * (.35 + Math.random() * .45);
    const s = (.7 + (y - groundY) / (H - groundY) * .6) * S;
    return { dir, y, s, v: (60 + Math.random() * 90) * s,
             x: init ? Math.random() * W : (dir > 0 ? -150 : W + 150) };
  }

  // ---------- 비 ----------
  let drops = [], ripples = [];
  function newDrop(init) {
    const near = Math.random() < .35;
    const gh = H - groundY;
    return {
      near, x: -100 + Math.random() * (W + 200),
      y: init ? -H + Math.random() * (H + groundY) : -10 - Math.random() * 200,
      vy: near ? 1100 + Math.random() * 400 : 600 + Math.random() * 250,
      len: near ? 14 + Math.random() * 12 : 6 + Math.random() * 6,
      landY: groundY + (near ? 8 + Math.random() * (gh - 8) : Math.random() * gh * .5),
    };
  }
  function initRain() {
    drops = [];
    const n = Math.floor(W * H / 2200);
    for (let i = 0; i < n; i++) drops.push(newDrop(true));
    ripples = [];
  }

  // ---------- 번개 ----------
  let strike = null, nextStrike = 4, firstDone = false;

  function makeBolt(x0, y0, x1, y1) {
    const segs = [];
    (function path(ax, ay, bx, by, disp0, w, depth) {
      let pts = [[ax, ay], [bx, by]], disp = disp0;
      for (let i = 0; i < 7 && disp > 1; i++) {
        const np = [pts[0]];
        for (let j = 1; j < pts.length; j++) {
          const [px, py] = pts[j - 1], [qx, qy] = pts[j];
          np.push([(px + qx) / 2 + (Math.random() - .5) * disp, (py + qy) / 2 + (Math.random() - .5) * disp * .5]);
          np.push(pts[j]);
        }
        pts = np; disp *= .55;
      }
      segs.push({ pts, w });
      if (depth < 2) for (let j = 8; j < pts.length - 8; j++) if (Math.random() < .035) {
        const [px, py] = pts[j];
        path(px, py, px + (Math.random() - .5) * W * .25, py + (by - py) * (.15 + Math.random() * .3),
             disp0 * .5, w * .5, depth + 1);
      }
    })(x0, y0, x1, y1, Math.abs(y1 - y0) * .35, 1, 0);
    return segs;
  }

  function trigger(withBolt) {
    const x = W * (.2 + Math.random() * .6);
    strike = withBolt
      ? { t: clock, x, bolt: makeBolt(x, H * .03, x + (Math.random() - .5) * W * .1, groundY - H * .1),
          pulses: [0, .12, .26], amps: [1, .55, .8] }
      : { t: clock, x, bolt: null, pulses: [0, .15], amps: [.45, .3] };
  }

  function flashLevel() {
    if (!strike) return 0;
    const dt = clock - strike.t;
    if (dt > 1.6) { strike = null; return 0; }
    let l = 0;
    for (let i = 0; i < strike.pulses.length; i++) {
      const d = dt - strike.pulses[i];
      if (d >= 0) l = Math.max(l, strike.amps[i] * Math.exp(-d / .07));
    }
    return Math.max(l, dt >= 0 ? Math.exp(-dt / .4) * .3 : 0);
  }

  function drawBolt(l) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const pass = [[7, .12, '#8fa8ff'], [3, .35, '#b9c9ff'], [1.2, 1, '#ffffff']];
    for (const [lw, a, col] of pass) {
      ctx.strokeStyle = col;
      ctx.globalAlpha = Math.min(1, l * 1.2) * a;
      for (const s of strike.bolt) {
        ctx.lineWidth = lw * s.w * S;
        ctx.beginPath();
        ctx.moveTo(s.pts[0][0], s.pts[0][1]);
        for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i][0], s.pts[i][1]);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- 그리기 ----------
  function drawSky(f) {
    const g = ctx.createLinearGradient(0, 0, 0, groundY);
    g.addColorStop(0, '#070914');
    g.addColorStop(.55, '#141234');
    g.addColorStop(1, '#4a2850');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const k = Math.min(1, f * .9);
    const cr = 28 + (120 - 28) * k, cg = 26 + (135 - 26) * k, cb = 52 + (190 - 52) * k;
    for (const c of clouds) {
      const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, c.r);
      gr.addColorStop(0, `rgba(${cr|0},${cg|0},${cb|0},${c.a})`);
      gr.addColorStop(1, `rgba(${cr|0},${cg|0},${cb|0},0)`);
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(2.6, 1);
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(0, 0, c.r, 0, 7); ctx.fill();
      ctx.restore();
    }

    if (f > .01) {
      ctx.fillStyle = `rgba(170,190,255,${f * .35})`;
      ctx.fillRect(0, 0, W, groundY);
      if (strike) {
        const x = strike.x, gr = ctx.createRadialGradient(x, H * .08, 0, x, H * .08, W * .5);
        gr.addColorStop(0, `rgba(200,215,255,${f * .55})`);
        gr.addColorStop(1, 'rgba(200,215,255,0)');
        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, W, groundY);
      }
    }
  }

  function drawHaze(f) {
    const g = ctx.createLinearGradient(0, groundY * .35, 0, groundY);
    g.addColorStop(0, 'rgba(70,60,120,0)');
    g.addColorStop(1, `rgba(${70 + f * 60|0},${60 + f * 70|0},${120 + f * 80|0},.35)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, groundY * .35, W, groundY * .65);
  }

  function drawLayer(L, f, t) {
    const [r, g, b] = L.rgb;
    ctx.fillStyle = `rgb(${r + f * 55|0},${g + f * 65|0},${b + f * 95|0})`;
    for (const bd of L.b) {
      ctx.fillRect(bd.x, bd.y, bd.w, bd.h + 2);
      if (bd.cap) ctx.fillRect(bd.x + bd.cap.dx, bd.y - bd.cap.h, bd.cap.w, bd.cap.h + 1);
      if (bd.ant) ctx.fillRect(bd.ant.x, bd.ant.y, 1.5, bd.ant.h + 1);
    }
    // 창문
    for (const bd of L.b) for (const w of bd.wins) {
      if (t >= w.next) { w.on = Math.random() < bd.lb; w.next = t + 15 + Math.random() * 105; }
      if (!w.on) continue;
      if (w.tv) {
        ctx.globalAlpha = L.a * Math.max(.15, .6 + .4 * Math.sin(t * 7 + w.ph) * Math.sin(t * 3.1 + w.ph * 2));
        ctx.fillStyle = '#8cc4ff';
      } else {
        ctx.globalAlpha = L.a;
        ctx.fillStyle = w.col;
      }
      ctx.fillRect(w.x, w.y, w.w, w.h);
    }
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = 'lighter';
    if (L.near) {
      for (const bd of L.b) for (const w of bd.wins) if (w.on && !w.tv)
        drawGlow(w.col, w.x + w.w / 2, w.y + w.h / 2, 14 * S, .12);
      for (const s of L.signs) {
        const a = (s.faulty && Math.sin(t * 37 + s.ph) > .9) ? .25 : 1;
        drawGlow(s.col, s.x + s.w / 2, s.y + s.h / 2, s.h * .9, .5 * a);
        ctx.globalAlpha = a;
        ctx.fillStyle = s.col;
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = a * .7;
        ctx.fillRect(s.x + s.w / 2 - 1, s.y + 2, 2, s.h - 4);
      }
    }
    // 안테나 경고등
    for (const bd of L.b) if (bd.ant && ((t * .8 + bd.ant.ph) % 1) < .4)
      drawGlow('#ff2a2a', bd.ant.x + .75, bd.ant.y, 9 * S, .9);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawGround(f, t) {
    const g = ctx.createLinearGradient(0, groundY, 0, H);
    g.addColorStop(0, `rgb(${20 + f * 50|0},${23 + f * 55|0},${46 + f * 70|0})`);
    g.addColorStop(1, `rgb(${5 + f * 25|0},${6 + f * 28|0},${12 + f * 40|0})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = 'rgba(160,170,220,.12)';
    ctx.fillRect(0, groundY, W, 1);

    // 젖은 길에 비친 불빛
    ctx.globalCompositeOperation = 'lighter';
    const gh = H - groundY;
    for (const r of refl) {
      const k = .6 + .4 * Math.sin(t * 2.3 + r.ph), w = r.w * (.8 + .4 * k);
      const gr = ctx.createLinearGradient(0, groundY, 0, H);
      gr.addColorStop(0, `rgba(${r.c[0]},${r.c[1]},${r.c[2]},${.35 * r.a * k})`);
      gr.addColorStop(1, `rgba(${r.c[0]},${r.c[1]},${r.c[2]},0)`);
      ctx.fillStyle = gr;
      ctx.fillRect(r.x - w / 2, groundY, w, gh);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawLamps() {
    for (const l of lamps) {
      const top = l.base - H * .2;
      ctx.fillStyle = '#080a14';
      ctx.fillRect(l.x - 1.5 * S, top, 3 * S, l.base - top);
      ctx.fillRect(l.x - 1.5 * S, top, 14 * S, 2.5 * S);
      ctx.globalCompositeOperation = 'lighter';
      drawGlow('#ffcf8a', l.x + 12 * S, top + 4 * S, 90 * S, .55);
      ctx.save();
      ctx.translate(l.x + 12 * S, l.base + (H - groundY) * .22);
      ctx.scale(2.5, .4);
      drawGlow('#ffcf8a', 0, 0, 90 * S, .3);
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function updateDrawCars(dt) {
    for (let i = 0; i < cars.length; i++) {
      const c = cars[i];
      c.x += c.dir * c.v * dt;
      if ((c.dir > 0 && c.x > W + 160) || (c.dir < 0 && c.x < -160)) { cars[i] = newCar(false); continue; }
      const w = 70 * c.s, h = 14 * c.s, fx = c.x + c.dir * w / 2, bx = c.x - c.dir * w / 2;
      ctx.fillStyle = '#07080f';
      ctx.fillRect(c.x - w / 2, c.y - h, w, h);
      ctx.fillRect(c.x - w * .3, c.y - h * 1.7, w * .6, h * .8);
      ctx.globalCompositeOperation = 'lighter';
      drawGlow('#fff2d0', fx, c.y - h * .45, 30 * c.s, .8);
      drawGlow('#ff2a2a', bx, c.y - h * .45, 18 * c.s, .8);
      for (const [x, col] of [[fx, '255,242,208'], [bx, '255,42,42']]) {
        const gr = ctx.createLinearGradient(0, c.y, 0, c.y + 60 * c.s);
        gr.addColorStop(0, `rgba(${col},.3)`);
        gr.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = gr;
        ctx.fillRect(x - 4 * c.s, c.y, 8 * c.s, 60 * c.s);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function updateDrawRain(dt, f, t) {
    const slant = .12 + .05 * Math.sin(t * .3);
    const far = [], near = [];
    for (const d of drops) {
      d.y += d.vy * dt;
      d.x += d.vy * slant * dt;
      if (d.y >= d.landY) {
        if ((d.near || Math.random() < .3) && ripples.length < 400)
          ripples.push({ x: d.x, y: d.landY, r: 1, max: 8 + Math.random() * 14 * S, a: .5 });
        Object.assign(d, newDrop(false));
        continue;
      }
      (d.near ? near : far).push(d);
    }

    // 파문
    ctx.lineWidth = 1;
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += dt * 40;
      r.a = .5 * (1 - r.r / r.max);
      if (r.a <= 0) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(180,200,240,${r.a})`;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * .3, 0, 0, 7); ctx.stroke();
    }

    for (const [arr, lw, a, col] of [[far, 1, .25, '170,190,230'], [near, 1.4, .45, '200,215,255']]) {
      ctx.strokeStyle = `rgba(${col},${Math.min(1, a + f * .3)})`;
      ctx.lineWidth = lw;
      ctx.beginPath();
      for (const d of arr) {
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - slant * d.len, d.y - d.len);
      }
      ctx.stroke();
    }
  }

  // ---------- 루프 ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now; clock += dt;

    if (clock >= nextStrike) {
      trigger(!firstDone || Math.random() > .25);
      firstDone = true;
      nextStrike = clock + 11 + Math.random() * 11;
    }
    const f = flashLevel();

    for (const c of clouds) {
      c.x += c.v * dt;
      if (c.x - c.r * 2.6 > W) c.x = -c.r * 2.6;
    }

    ctx.clearRect(0, 0, W, H);
    drawSky(f);
    if (strike && strike.bolt && f > .03) drawBolt(f);
    drawLayer(layers[0], f, clock);
    drawHaze(f);
    drawLayer(layers[1], f, clock);
    drawHaze(f);
    drawLayer(layers[2], f, clock);
    drawGround(f, clock);
    drawLamps();
    updateDrawCars(dt);
    updateDrawRain(dt, f, clock);

    if (f > .01) {
      ctx.fillStyle = `rgba(190,205,255,${f * .08})`;
      ctx.fillRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
    initRain();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointerdown', () => { trigger(true); firstDone = true; });
  setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 8000);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
