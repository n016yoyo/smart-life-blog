<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비 오는 밤의 도시 야경</title>
<style>
  html, body { margin: 0; height: 100%; background: #03040a; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  // 시드 고정 난수 — 창 크기가 바뀌어도 건물 배치가 같은 패턴으로 다시 만들어짐
  function mulberry32(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 건물 층: 멀수록 낮고, 어둡고, 불빛이 적고, 흐리게 그려짐
  const LAYERS = [
    { color: '#141a33', minH: 0.10, maxH: 0.28, minW: 60, maxW: 110, lit: 0.10, alpha: 0.4 },
    { color: '#0c1024', minH: 0.16, maxH: 0.42, minW: 55, maxW: 120, lit: 0.22, alpha: 0.7 },
    { color: '#06080f', minH: 0.24, maxH: 0.56, minW: 80, maxW: 170, lit: 0.30, alpha: 1.0 },
  ];
  // 빗줄기 층: 멀수록 짧고 느리고 흐림
  const RAIN_LAYERS = [
    { v: 6,  len: 8,  alpha: 0.10, width: 0.8 },
    { v: 10, len: 12, alpha: 0.18, width: 1.0 },
    { v: 15, len: 18, alpha: 0.32, width: 1.3 },
  ];
  const WIN_W = 5, WIN_H = 7, WIN_GX = 11, WIN_GY = 15;
  const WIN_COLORS = ['#ffd27a', '#ffe7b0', '#9fd8ff', '#ffb17a'];
  const WIND = 0.12;            // 바람: 1px 낙하당 가로 이동량
  const TOGGLE_RATE = 0.00001;  // 창문 상태가 다시 정해지는 확률 (창 하나·프레임당)

  let W = 0, H = 0, GROUND = 0;
  let city = [], lamps = [], drops = [], splashes = [];
  let startTs = null, lastTs = null;

  // 번개: 6~8초 사이에 딱 한 번만 침
  const bolt = { at: 6000 + Math.random() * 2000, fired: false, t0: 0, main: null, branch: null };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    GROUND = H * 0.9;
    buildCity();
    buildLamps();
    buildRain();
  }

  function buildCity() {
    const rnd = mulberry32(20261017);
    city = LAYERS.map(() => []);
    LAYERS.forEach((L, li) => {
      let x = -30;
      while (x < W + 30) {
        const w = L.minW + rnd() * (L.maxW - L.minW);
        const h = H * (L.minH + rnd() * (L.maxH - L.minH));
        const top = GROUND - h;
        const cols = Math.floor((w - 14) / WIN_GX);
        const rows = Math.floor((h - 20) / WIN_GY);
        const offX = (w - cols * WIN_GX) / 2;
        const windows = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            windows.push({
              x: x + offX + c * WIN_GX,
              y: top + 14 + r * WIN_GY,
              on: rnd() < L.lit,
              color: WIN_COLORS[Math.floor(rnd() * WIN_COLORS.length)],
            });
          }
        }
        city[li].push({
          x, w, top,
          antenna: rnd() < 0.25 ? 15 + rnd() * 35 : 0,
          windows,
        });
        x += w + rnd() * 6;  // 건물 사이 약간의 틈
      }
    });
  }

  function buildLamps() {
    lamps = [];
    for (let x = 40; x < W + 100; x += 170 + Math.random() * 60) {
      lamps.push({ x, phase: Math.random() * Math.PI * 2 });
    }
  }

  function buildRain() {
    const count = Math.min(900, Math.floor((W * H) / 1800));
    drops = [];
    for (let i = 0; i < count; i++) {
      const depth = Math.floor(Math.random() * 3);
      const layer = RAIN_LAYERS[depth];
      drops.push({
        x: Math.random() * W,
        y: Math.random() * GROUND,
        depth,
        v: layer.v * (0.8 + Math.random() * 0.4),
        len: layer.len * (0.8 + Math.random() * 0.4),
      });
    }
  }

  // 번개 줄기 하나와 옆으로 갈라지는 가지 하나를 만듦
  function makeBolt() {
    const steps = 16;
    const main = [];
    const targetY = GROUND - H * (0.3 + Math.random() * 0.25);
    let x = W * (0.25 + Math.random() * 0.5);
    for (let i = 0; i <= steps; i++) {
      main.push({ x, y: (targetY * i) / steps });
      x += (Math.random() - 0.5) * W * 0.04;
    }
    const from = main[Math.floor(steps * 0.4)];
    const dir = Math.random() < 0.5 ? -1 : 1;
    const branch = [{ x: from.x, y: from.y }];
    for (let i = 1; i <= 5; i++) {
      branch.push({
        x: from.x + dir * i * W * (0.012 + Math.random() * 0.01),
        y: from.y + i * H * 0.035,
      });
    }
    return { main, branch };
  }

  function update(dt) {
    // 창문 불 켜짐/꺼짐 (켜져 있을 비율은 층별 lit 값을 유지)
    city.forEach((layer, li) => {
      const lit = LAYERS[li].lit;
      for (const b of layer) for (const w of b.windows) {
        if (Math.random() < TOGGLE_RATE * dt) w.on = Math.random() < lit;
      }
    });

    // 빗방울: 바닥에 닿으면 튀기고 위에서 다시 떨어짐
    for (const d of drops) {
      d.y += d.v * dt;
      d.x += d.v * WIND * dt;
      if (d.y > GROUND) {
        if (d.depth === 2 && Math.random() < 0.5 && splashes.length < 300) {
          splashes.push({ x: d.x, y: GROUND + Math.random() * 6, r: 1, life: 1 });
        }
        d.y = -d.len - Math.random() * 40;
        d.x = Math.random() * (W + 60) - 30;
      }
    }

    for (const s of splashes) {
      s.r += 0.5 * dt;
      s.life -= 0.06 * dt;
    }
    splashes = splashes.filter(s => s.life > 0);
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#03040a');
    g.addColorStop(0.55, '#0e1430');
    g.addColorStop(1, '#2b2446');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 도시 불빛이 구름에 번진 빛
    const glow = ctx.createRadialGradient(W / 2, GROUND, 0, W / 2, GROUND, W * 0.6);
    glow.addColorStop(0, 'rgba(255, 150, 90, 0.18)');
    glow.addColorStop(1, 'rgba(255, 150, 90, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }

  function drawCity(ms) {
    city.forEach((layer, li) => {
      const L = LAYERS[li];
      for (const b of layer) {
        ctx.fillStyle = L.color;
        ctx.fillRect(b.x, b.top, b.w, GROUND - b.top);
        if (b.antenna) {
          const cx = b.x + b.w / 2;
          ctx.fillRect(cx - 1, b.top - b.antenna, 2, b.antenna);
          // 꼭대기 경고등: 천천히 깜빡
          if (Math.sin(ms / 500 + b.x) > 0.5) {
            ctx.fillStyle = 'rgba(255, 70, 70, 0.9)';
            ctx.fillRect(cx - 1.5, b.top - b.antenna - 2, 3, 3);
          }
        }
        ctx.globalAlpha = L.alpha;
        for (const w of b.windows) {
          if (!w.on) continue;
          ctx.fillStyle = w.color;
          ctx.fillRect(w.x, w.y, WIN_W, WIN_H);
        }
        ctx.globalAlpha = 1;
      }
    });
  }

  function drawGround(ms) {
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, '#0b0d18');
    g.addColorStop(1, '#030409');
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#1b1f31';
    ctx.fillRect(0, GROUND, W, 2);

    // 가로등 불빛 + 젖은 바닥에 비친 반사
    for (const lamp of lamps) {
      const flick = 0.85 + 0.15 * Math.sin(ms / 230 + lamp.phase);
      const hx = lamp.x, hy = GROUND - 70;

      const glow = ctx.createRadialGradient(hx, hy, 0, hx, hy, 130);
      glow.addColorStop(0, `rgba(255, 190, 110, ${0.30 * flick})`);
      glow.addColorStop(1, 'rgba(255, 190, 110, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(hx - 130, hy - 130, 260, 260);

      ctx.save();
      ctx.translate(hx, GROUND + 10);
      ctx.scale(1, 0.25);
      const refl = ctx.createRadialGradient(0, 0, 0, 0, 0, 90);
      refl.addColorStop(0, `rgba(255, 190, 110, ${0.22 * flick})`);
      refl.addColorStop(1, 'rgba(255, 190, 110, 0)');
      ctx.fillStyle = refl;
      ctx.fillRect(-90, -90, 180, 180);
      ctx.restore();

      ctx.strokeStyle = '#080a12';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(hx, GROUND);
      ctx.lineTo(hx, hy);
      ctx.stroke();
      ctx.fillStyle = `rgba(255, 226, 168, ${flick})`;
      ctx.beginPath();
      ctx.arc(hx, hy, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 낮게 깔린 안개가 천천히 가로로 흐름
  function drawFog(sec) {
    for (let i = 0; i < 4; i++) {
      const speed = 12 + i * 6;  // 초당 px
      const span = W + 800;
      const x = ((sec * speed + i * span / 4) % span) - 400;
      const y = H * (0.55 + i * 0.1);
      const r = W * 0.35;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1, 0.3);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      g.addColorStop(0, 'rgba(120, 130, 170, 0.09)');
      g.addColorStop(1, 'rgba(120, 130, 170, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.restore();
    }
  }

  // 번개 밝기: 두 번 번쩍인 뒤 서서히 사라짐
  function boltIntensity(age) {
    if (age < 0 || age > 700) return 0;
    if (age < 60) return 1;                          // 첫 번쩍
    if (age < 120) return 0.15;                      // 잠깐 꺼짐
    if (age < 180) return 0.9;                       // 두 번째 번쩍
    return 0.9 * Math.exp(-(age - 180) / 110);       // 서서히 사라짐
  }

  function strokePath(pts, width) {
    ctx.lineWidth = width;
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.stroke();
  }

  function drawLightning(ms) {
    if (!bolt.fired) return;
    const I = boltIntensity(ms - bolt.t0);
    if (I <= 0) return;

    // 하늘 전체가 잠깐 환해짐
    ctx.fillStyle = `rgba(190, 205, 255, ${0.28 * I})`;
    ctx.fillRect(0, 0, W, H);

    // 번개 줄기: 바깥 글로우 + 안쪽 밝은 선
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.shadowColor = '#9fbfff';
    ctx.shadowBlur = 24;
    ctx.strokeStyle = '#e6efff';
    ctx.globalAlpha = I;
    strokePath(bolt.main, 2.2);
    ctx.globalAlpha = I * 0.7;
    strokePath(bolt.branch, 1.2);
    ctx.restore();
  }

  function drawRain() {
    RAIN_LAYERS.forEach((L, d) => {
      ctx.strokeStyle = `rgba(190, 205, 235, ${L.alpha})`;
      ctx.lineWidth = L.width;
      ctx.beginPath();
      for (const p of drops) {
        if (p.depth !== d) continue;
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.len * WIND, p.y - p.len);
      }
      ctx.stroke();
    });
  }

  function drawSplashes() {
    ctx.strokeStyle = 'rgba(200, 215, 240, 0.5)';
    ctx.lineWidth = 1;
    for (const s of splashes) {
      ctx.globalAlpha = s.life * 0.6;
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, s.r * 3, s.r, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    if (startTs === null) startTs = now;
    const ms = now - startTs;
    const dt = lastTs === null ? 1 : Math.min((now - lastTs) / 16.67, 3);
    lastTs = now;

    if (!bolt.fired && ms >= bolt.at) {
      const b = makeBolt();
      bolt.fired = true;
      bolt.t0 = ms;
      bolt.main = b.main;
      bolt.branch = b.branch;
    }

    update(dt);
    drawSky();
    drawCity(ms);
    drawGround(ms);
    drawFog(ms / 1000);
    drawLightning(ms);
    drawRain();
    drawSplashes();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
