<!doctype html>
<html lang="ko">
<head>

<title>포켓몬스터 레드 — 태초마을</title>
<style>
:root { --bg: #191b26; --btn: #3a3e52; --btn-d: #14161f; --ab: #c8304a; --ab-d: #6d1426; --ink: #cfd3e6; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: var(--ink); }
#app { position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#screenWrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
#screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 4px;
  box-shadow: 0 0 0 6px #2b2e3e, 0 0 0 7px #3b3f55, 0 18px 40px rgba(0,0,0,.55); background: #000; }
#snd { position: absolute; right: 10px; top: 10px; width: 34px; height: 34px; border-radius: 50%; border: 0;
  background: #2b2e3e; color: var(--ink); font-size: 17px; line-height: 34px; text-align: center; cursor: pointer; z-index: 3; }
#pad { flex: 0 0 auto; position: relative; width: 100%; max-width: 520px; margin: 0 auto; height: min(40vh, 290px); min-height: 200px; }
#dpad { position: absolute; left: 6%; top: 50%; transform: translateY(-58%); width: min(40vw, 164px); aspect-ratio: 1; touch-action: none; cursor: pointer; }
#dpad i { position: absolute; background: var(--btn); box-shadow: 0 5px 0 var(--btn-d); }
#dpad .h { left: 0; right: 0; top: 33.4%; height: 33.2%; border-radius: 10px; }
#dpad .v { top: 0; bottom: 0; left: 33.4%; width: 33.2%; border-radius: 10px; }
#dpad .c { left: 33.4%; top: 33.4%; width: 33.2%; height: 33.2%; box-shadow: none; }
#dpad .c::after { content: ""; position: absolute; inset: 28%; border-radius: 50%; background: #2c2f40; }
#dpad b { position: absolute; width: 33.2%; height: 33.2%; display: flex; align-items: center; justify-content: center; color: #6e7390; font-size: 13px; pointer-events: none; }
#dpad .u { left: 33.4%; top: 0; } #dpad .d { left: 33.4%; bottom: 0; } #dpad .l { left: 0; top: 33.4%; } #dpad .r { right: 0; top: 33.4%; }
#dpad[data-dir=up] .u, #dpad[data-dir=down] .d, #dpad[data-dir=left] .l, #dpad[data-dir=right] .r { color: #fff; background: rgba(255,255,255,.12); border-radius: 8px; }
#ab { position: absolute; right: 5%; top: 50%; transform: translateY(-62%); width: min(42vw, 176px); height: min(32vw, 132px); }
.btn { position: absolute; width: min(18vw, 74px); aspect-ratio: 1; border-radius: 50%; background: var(--ab); color: rgba(255,255,255,.85);
  display: flex; align-items: center; justify-content: center; font: 800 20px system-ui, sans-serif; box-shadow: 0 5px 0 var(--ab-d); touch-action: none; cursor: pointer; }
.btn.a { right: 0; top: 0; } .btn.b { left: 0; bottom: 0; }
.btn.on, .pill.on i { transform: translateY(4px); box-shadow: 0 1px 0 var(--ab-d); filter: brightness(1.15); }
#ss { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); display: flex; gap: 22px; }
.pill { display: flex; flex-direction: column; align-items: center; gap: 5px; touch-action: none; cursor: pointer; padding: 6px; }
.pill i { display: block; width: 58px; height: 16px; border-radius: 9px; background: #4a4e66; box-shadow: 0 3px 0 var(--btn-d); transform: rotate(-18deg); }
.pill.on i { box-shadow: 0 0 0 var(--btn-d); }
.pill span { font: 700 10px system-ui, sans-serif; letter-spacing: .12em; color: #7d82a0; }
#keys { display: none; text-align: center; font-size: 13px; color: #8a8fa8; padding: 10px 12px 14px; line-height: 1.6; }
#keys kbd { background: #2b2e3e; border-radius: 4px; padding: 1px 6px; color: var(--ink); font: 600 12px ui-monospace, monospace; }
@media (hover: hover) and (pointer: fine) {
  #pad { display: none; }

}
@media (orientation: portrait) and (pointer: coarse) {
  #screenWrap { flex: 0 0 auto; height: min(calc((100vw - 20px) * 0.9 + 30px), 60vh); margin-top: max(3vh, 8px); }
  #pad { flex: 1 1 auto; height: auto; max-height: 340px; margin: auto; }
  #snd { top: auto; bottom: -38px; right: 14px; }
}
@media (orientation: landscape) and (max-height: 540px) and (pointer: coarse) {
  #pad { position: absolute; inset: 0; height: auto; max-width: none; min-height: 0; pointer-events: none; }
  #pad > * { pointer-events: auto; }
  #screenWrap { padding: 6px max(150px, 23vw); }
  #dpad { left: max(14px, 3vw); top: auto; bottom: 16vh; transform: none; width: min(22vw, 150px); }
  #ab { right: max(14px, 3vw); top: auto; bottom: 20vh; transform: none; width: min(24vw, 160px); height: min(17vw, 118px); }

/* AI TIGER MASK 판(2026-10-04): 클로드가 만든 원본에 우리 마스코트 스파크 도트 로고만 더했다. 게임 코드는 그대로 */

<div id="app">

<script>
'use strict';
// =====================================================================
//  1. 기본 유틸 & 픽셀 엔진 (이미지 파일 없이 전부 코드로 픽셀을 찍는다)
// =====================================================================
const W = 160, H = 144, TS = 16;
const rnd = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const _rgb = {};
function rgb(hex) {
  if (_rgb[hex]) return _rgb[hex];
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return (_rgb[hex] = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]);
}

// 공용 팔레트 (문자 → 색)
const BASEPAL = {
  K: '#202028', W: '#f8f8f8', k: '#585860', g: '#9090a0', G: '#c8c8d0',
  S: '#f8d0a8', s: '#d8a070', E: '#202028', R: '#e03828', r: '#a01818',
  Y: '#f8d038', y: '#c89818', B: '#3868d0', b: '#203888', N: '#a06830', n: '#684018',
};

// 문자열 행 배열 → 캔버스
function fromRows(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = mkCanvas(w, h), x = c.getContext('2d'), id = x.createImageData(w, h), d = id.data;
  for (let j = 0; j < h; j++) {
    const r = rows[j];
    for (let i = 0; i < r.length; i++) {
      const ch = r[i];
      if (ch === '.' || ch === ' ') continue;
      const col = (pal && pal[ch]) || BASEPAL[ch];
      if (!col) continue;
      const [R, G, B] = rgb(col), o = (j * w + i) * 4;
      d[o] = R; d[o + 1] = G; d[o + 2] = B; d[o + 3] = 255;
    }
  }
  x.putImageData(id, 0, 0);
  return c;
}
function flipH(src) {
  const c = mkCanvas(src.width, src.height), x = c.getContext('2d');
  x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0);
  return c;
}

// ---- 도형 마스크: 정수 픽셀 좌표 → 포함 여부 ----
const M = {
  E: (cx, cy, rx, ry) => (x, y) => { const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; return dx * dx + dy * dy <= 1; },
  R: (x0, y0, w, h) => (x, y) => x >= x0 && y >= y0 && x < x0 + w && y < y0 + h,
  P: pts => (x, y) => {
    const px = x + .5, py = y + .5; let ins = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) ins = !ins;
    }
    return ins;
  },
  // 두께 있는 꺾은선 (캡슐들의 합집합)
  L: (pts, r) => (x, y) => {
    const px = x + .5, py = y + .5;
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy || 1;
      const t = clamp(((px - ax) * vx + (py - ay) * vy) / l2, 0, 1);
      const dx = px - (ax + vx * t), dy = py - (ay + vy * t);
      if (dx * dx + dy * dy <= r * r) return true;
    }
    return false;
  },
  U: (...ms) => (x, y) => ms.some(m => m(x, y)),
  I: (a, b) => (x, y) => a(x, y) && b(x, y),
  D: (a, b) => (x, y) => a(x, y) && !b(x, y),
};

// ---- 페인터: 도형을 겹쳐 그리고 외곽선/음영을 자동으로 찍는다 ----
class Pix {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  get(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : this.d[y * this.w + x]; }
  set(x, y, c) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.d[y * this.w + x] = c; return this; }
  // o: {c 채움, s 그림자, l 하이라이트, ol 외곽선(null=없음), st 그림자두께, on 기존픽셀만}
  fill(m, o) {
    if (typeof o === 'string') o = { c: o };
    const ol = o.ol === undefined ? '#202028' : o.ol, st = o.st || 2, out = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (!m(x, y)) continue;
      if (o.on && this.get(x, y) == null) continue;
      if (o.clip && !o.clip(x, y)) continue;
      let c = o.c;
      const edge = !m(x - 1, y) || !m(x + 1, y) || !m(x, y - 1) || !m(x, y + 1);
      if (edge && ol) c = ol;
      else if (o.s && (!m(x + 1, y + st) || !m(x + st, y + 1) || !m(x, y + st))) c = o.s;
      else if (o.l && (!m(x - 1, y - 2) || !m(x - 2, y - 1))) c = o.l;
      out.push(x, y, c);
    }
    for (let i = 0; i < out.length; i += 3) this.set(out[i], out[i + 1], out[i + 2]);
    return this;
  }
  line(x0, y0, x1, y1, c) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy;
    for (;;) {
      this.set(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx; }
      if (e2 <= dx) { e += dx; y0 += sy; }
    }
    return this;
  }
  stamp(x0, y0, rows, map) {
    rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch === '.' || ch === ' ') continue; this.set(x0 + i, y0 + j, (map && map[ch]) || BASEPAL[ch]); } });
    return this;
  }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); return this; }
  outline(c = '#202028') {
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.get(x, y) != null) continue;
      if (this.get(x - 1, y) != null || this.get(x + 1, y) != null || this.get(x, y - 1) != null || this.get(x, y + 1) != null) add.push(x, y);
    }
    for (let i = 0; i < add.length; i += 2) this.set(add[i], add[i + 1], c);
    return this;
  }
  canvas() {
    const c = mkCanvas(this.w, this.h), x = c.getContext('2d'), id = x.createImageData(this.w, this.h), d = id.data;
    for (let i = 0; i < this.d.length; i++) {
      const col = this.d[i]; if (col == null) continue;
      const [R, G, B] = rgb(col); d[i * 4] = R; d[i * 4 + 1] = G; d[i * 4 + 2] = B; d[i * 4 + 3] = 255;
    }
    x.putImageData(id, 0, 0);
    return c;
  }
}

// 캔버스에 직접 찍는 보조 함수 (타일/건물용)
function paint(w, h, fn) { const c = mkCanvas(w, h), x = c.getContext('2d'); fn(x, (col, px, py, pw = 1, ph = 1) => { x.fillStyle = col; x.fillRect(px, py, pw, ph); }); return c; }
// =====================================================================
//  2. 픽셀 아트 정의 (캐릭터 / 타일 / 건물 / 포켓몬 / 트레이너 / UI)
// =====================================================================

function buildChar(def) {
  const out = {}, hd = HEADS[def.head], bd = BODIES[def.body];
  for (const dir of ['down', 'up', 'left']) {
    const stand = fromRows(hd[dir].concat(bd[dir][0]), def.pal);
    const walk = fromRows(hd[dir].concat(bd[dir][1]), def.pal);
    out[dir] = dir === 'left' ? [stand, walk, walk] : [stand, walk, flipH(walk)];
  }
  out.right = out.left.map(flipH);
  return out;
}

function buildBall(size) {
  const p = new Pix(size, size), r = size / 2 - 1, cx = size / 2, cy = size / 2;
  p.fill(M.E(cx, cy, r + .5, r + .5), { c: '#f8f8f8', s: '#c8c8d0' });
  p.fill(M.I(M.E(cx, cy, r + .5, r + .5), M.R(0, 0, size, Math.floor(cy))), { c: '#e83830', s: '#a01818', l: '#f88878', ol: null });
  p.line(1, Math.floor(cy), size - 2, Math.floor(cy), '#202028');
  // 외곽선 다시
  const m = M.E(cx, cy, r + .5, r + .5);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (m(x, y) && (!m(x - 1, y) || !m(x + 1, y) || !m(x, y - 1) || !m(x, y + 1))) p.set(x, y, '#202028');
  const b = Math.max(1, Math.round(size / 8));
  p.rect(Math.floor(cx) - b, Math.floor(cy) - b, b * 2, b * 2, '#202028');
  if (size > 8) p.rect(Math.floor(cx) - b + 1, Math.floor(cy) - b + 1, b * 2 - 2 || 1, b * 2 - 2 || 1, '#f8f8f8');
  return p.canvas();
}

function buildArt() {
  ART.chars = {};
  for (const k in CHARDEFS) ART.chars[k] = buildChar(CHARDEFS[k]);
  ART.tiles = {};
  for (const k in TILEART) {
    ART.tiles[k] = [TILEART[k](0)];
    if (k === '~' || k === 'f') ART.tiles[k].push(TILEART[k](1));
  }
  ART.tables = {};
  for (let i = 0; i < 16; i++) ART.tables[i] = tableTile({ u: i & 1, r: i & 2, d: i & 4, l: i & 8 });
  ART.houseRed = buildHouse('#d05048', '#902828', '#f08878');
  ART.houseBlue = buildHouse('#5878c8', '#30488a', '#88a8e8');
  ART.lab = buildLab();
  buildUI();
  ART.mon = {
    charmander: { front: artCharmander(), back: artCharmanderBack() },
    squirtle: { front: artSquirtle(), back: artSquirtleBack() },
    bulbasaur: { front: artBulbasaur(), back: artBulbasaurBack() },
  };
  ART.trainer = { rival: artRival(), oak: artOak(), player: artPlayer(), playerBack: artPlayerBack() };
}

const NOTE = (() => {
  const n = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
  return s => {

    const semi = n[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (m[3] - 4) * 12;
    return 440 * Math.pow(2, semi / 12);
  };
})();

function hasBatchim(word) {

function wrap(str, width) {

    const words = para.split(' ');
    for (let wi = 0; wi < words.length; wi++) {

      if (tw(cand) <= width) { line = cand; continue; }

      line = piece;
    }
    out.push(line);
  }
  return out;
}

function findPath(a, tx, ty, ignore = []) {

async function evRivalBattle() {
  const p = G.player, rival = getActor('rival');
  p.dir = 'up';
  await say(`${R()}: 잠깐, ${P()}!\f우리 포켓몬 실력을 확인해 보자고!\f덤벼! 내가 상대해 주지!`);
  // 라이벌이 주인공 옆까지 걸어온다
  let best = null;
  for (const [ax, ay] of [[p.x, p.y - 1], [p.x - 1, p.y], [p.x + 1, p.y]]) {
    if (ax === rival.x && ay === rival.y) { best = []; break; }
    if (isBlocked(ax, ay, rival)) continue;
    const path = findPath(rival, ax, ay);
    if (path && (!best || path.length < best.length)) best = path;
  }
  await walk(rival, best || []);
  rival.dir = dirTo(rival, p.x, p.y) || 'down';
  p.dir = OPP[rival.dir];

const BT = {};
const EBOX = { x: 96, y: 0, w: 56, h: 56 }, PBOX = { x: 8, y: 32, w: 64, h: 64 };

function drawMon(s) {
  if (!s.vis || s.blink) return;
  const b = s.box, w = s.img.width * s.k * s.scale, h = s.img.height * s.k * s.scale;
  const x = Math.round(b.x + (b.w - w) / 2 + s.ox), y = Math.round(b.y + b.h - h + s.dy);

function platform(cx, cy, rx, ry) {

  g.fillStyle = '#a8c088';
  for (let y = 1; y <= ry; y++) { const hw = Math.round(rx * Math.sqrt(1 - (y / ry) ** 2)); g.fillRect(cx - hw, cy + y, 2, 1); g.fillRect(cx + hw - 2, cy + y, 2, 1); }

async function battleTransition() {
  SND.playBgm('battle');
  for (let i = 0; i < 3; i++) { fade.color = '#202028'; fade.a = 0.75; await wait(5); fade.a = 0; await wait(5); }
  const bands = 9, bh = H / bands;
  let prog = 0;
  G.overlay = c => {
    c.fillStyle = '#202028';
    for (let i = 0; i < bands; i++) {
      const w = Math.min(1, Math.max(0, prog * 1.6 - i * 0.07)) * W;
      if (i % 2) c.fillRect((W - w) * S, i * bh * S, w * S, Math.ceil(bh * S)); else c.fillRect(0, i * bh * S, w * S, Math.ceil(bh * S));
    }
  };
  await tween(36, t => { prog = t; });
  fade.color = '#202028'; fade.a = 1; G.overlay = null;
}
async function startBattle(enemy) {

  await battleTransition();
  const pm = G.party[0], em = enemy.mon;
  Object.assign(BT, {
    pm, em, eHud: false, pHud: false, shake: 0, fx: null, pHp: pm.hp, eHp: em.hp,
    eTr: { img: ART.trainer.rival, x: -56, vis: true }, pTr: { img: ART.trainer.playerBack, x: 160, vis: true },
    e: sprState(ART.mon[em.id].front, EBOX), p: sprState(ART.mon[pm.id].back, PBOX, true),
    st: { p: { atk: 0, def: 0 }, e: { atk: 0, def: 0 } }, lastAct: 0,
  });

  G.scene = 'battle';
  fade.a = 0;
  await tween(50, t => { BT.eTr.x = -56 + (96 + 56) * t; BT.pTr.x = 160 - (160 - 8) * t; });
  await say(`라이벌 ${J.i(enemy.name)} 승부를 걸어왔다!`);
  await tween(24, t => { BT.eTr.x = 96 + 70 * t; });

  const tb = new TextBox(`가랏! ${pm.name}!`, { keep: true });
  await UI.open(tb);
  await appear('p');
  BT.pHud = true;
  await wait(20); UI.remove(tb);

  let result = null;
  while (!result) {
    const act = await chooseAction();

    if (act === 0) {
      const mi = await chooseMove();
      if (mi < 0) continue;
      result = await doTurn({ move: mi });
    } else if (act === 2) {
      const used = await battleBag();
      if (used) result = await doTurn({ item: true });
    } else if (act === 1) {
      await UI.open(new SummaryScreen(pm));

const stageMul = s => s >= 0 ? (2 + s) / 2 : 2 / (2 - s);
function calcDamage(att, def, M, aSide) {
  const dSide = aSide === 'p' ? 'e' : 'p', sp = SPECIES[att.id];
  const crit = rnd(256) < Math.floor(sp.base.spd / 2);
  let A = att.atk, D = def.def;
  if (!crit) { A = Math.max(1, Math.floor(A * stageMul(BT.st[aSide].atk))); D = Math.max(1, Math.floor(D * stageMul(BT.st[dSide].def))); }
  const L = att.lv * (crit ? 2 : 1);
  let dmg = Math.floor(Math.floor(Math.floor(2 * L / 5 + 2) * M.power * A / D) / 50) + 2;
  if (sp.types.includes(M.type)) dmg = Math.floor(dmg * 1.5);
  dmg = Math.max(1, Math.floor(dmg * (217 + rnd(39)) / 255));
  return { dmg, crit };
}
async function animHp(side, target) {
  const m = side === 'p' ? BT.pm : BT.em, key = side === 'p' ? 'pHp' : 'eHp';

async function useMove(aSide, mi) {
  const att = aSide === 'p' ? BT.pm : BT.em, def = aSide === 'p' ? BT.em : BT.pm, dSide = aSide === 'p' ? 'e' : 'p';
  const mv = att.moves[mi], M = MOVES[mv.id];
  mv.pp = Math.max(0, mv.pp - 1);
  const an = aSide === 'p' ? att.name : `상대 ${att.name}`, dn = aSide === 'p' ? `상대 ${def.name}` : def.name;
  await say(`${an}의 ${M.name}!`, { auto: 28 });

    SND.play('miss');

    return;
  }
  await moveAnim(M.anim, aSide);
  if (M.power) {
    const r = calcDamage(att, def, M, aSide);
    await animHp(dSide, def.hp - r.dmg);

  } else {
    const s = BT.st[dSide];

  }
}
async function faint(side) {
  const s = BT[side], m = side === 'p' ? BT.pm : BT.em;

}
async function doTurn(act) {
  const pm = BT.pm, em = BT.em;
  const ems = em.moves.map((mv, i) => i).filter(i => em.moves[i].pp > 0);
  const emi = ems[rnd(ems.length)];
  const order = [];
  if (act.item) order.push('e');
  else {
    const eFirst = em.spd > pm.spd || (em.spd === pm.spd && rnd(2));
    order.push(...(eFirst ? ['e', 'p'] : ['p', 'e']));
  }
  for (const side of order) {
    await useMove(side, side === 'p' ? act.move : emi);
    if (em.hp <= 0) { await faint('e'); return 'win'; }
    if (pm.hp <= 0) { await faint('p'); return 'lose'; }
  }
  return null;
}

  requestAnimationFrame(loop);

  acc += Math.min(100, now - lastT); lastT = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 6) { acc -= 1000 / 60; step(); n++; }
  if (n) render();
}
function syncSoundBtn() { const b = document.getElementById('snd'); if (b) b.textContent = SND.on ? '♪' : '×'; }
function boot() {
  buildArt();

  setupTouch();

  document.addEventListener('visibilitychange', () => {
    input.releaseAll();
    if (!SND.ctx) return;
    if (document.hidden) SND.ctx.suspend(); else SND.ctx.resume();
  });
  G.scene = 'title';
  SND.playBgm('title');
  window.__dbg = { G, UI, input, startWorld, startBattle, makeMon, runScript, say, SND };
  requestAnimationFrame(loop);
}
